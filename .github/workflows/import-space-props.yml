name: Import eight Orbit Drop props (one-time)
on:
  push:
    branches:
      - art/space-props-01-08
    paths:
      - .github/workflows/import-space-props.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Import and QA eight individual Orbit Drop prop PNGs
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          import json, urllib.request, concurrent.futures, time
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          sources=json.loads(r'''{"01":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/999fa034-ff89-4a23-a50d-1d35a963367f.png","02":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/43f1b77b-125f-4b61-8098-332424287ca9.png","03":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/e797a5a5-84bc-43c9-be79-bab6b3c29bf7.png","04":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/55c6464d-e56d-4ad2-a9fd-7c48dbb866d9.png","05":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/e8b427d4-7032-4e43-9277-869e2a9de634.png","06":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/aebcfe00-7302-49c9-9e7d-220180370118.png","07":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/e9ce973d-ae4b-4a95-a909-47d76a149608.png","08":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/5e574502-f9e2-4343-b8e4-a6933e666d6a.png"}''')
          expected=[f'{n:02d}' for n in range(1,9)]
          assert sorted(sources)==expected
          target_dir=Path('assets/raw')
          target_dir.mkdir(parents=True,exist_ok=True)
          def one(entry):
              ident,url=entry
              data=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'MarbleRushArtImporter/1.0'})
                      with urllib.request.urlopen(req,timeout=70) as response:
                          data=response.read(30000000)
                      break
                  except Exception:
                      if attempt==2: raise
                      time.sleep(2*(attempt+1))
              if not data or not data.startswith(b'\x89PNG\r\n\x1a\n') or not 10000<len(data)<29000000:
                  raise RuntimeError(f'{ident}: invalid source PNG data')
              source=Image.open(BytesIO(data))
              source.load()
              if not (500<=min(source.size) and max(source.size)<=4096):
                  raise RuntimeError(f'{ident}: unexpected source resolution {source.size}')
              rgba=source.convert('RGBA')
              alpha=rgba.getchannel('A')
              if alpha.getextrema()[0]==255:
                  raise RuntimeError(f'{ident}: source not transparent')
              bbox=alpha.point(lambda a:255 if a>10 else 0).getbbox()
              if bbox is None:
                  raise RuntimeError(f'{ident}: no subject visible')
              subject=rgba.crop(bbox)
              w,h=subject.size
              factor=min(860.0/w,860.0/h)
              nw,nh=max(1,round(w*factor)),max(1,round(h*factor))
              subject=subject.resize((nw,nh),Image.Resampling.LANCZOS)
              canvas=Image.new('RGBA',(1024,1024),(0,0,0,0))
              canvas.alpha_composite(subject,((1024-nw)//2,(1024-nh)//2))
              bounds=canvas.getchannel('A').getbbox()
              margin=min(bounds[0],bounds[1],1024-bounds[2],1024-bounds[3])
              if margin<79:
                  raise RuntimeError(f'{ident}: object too close to edge, margin={margin}')
              path=target_dir/f'prop_space_{ident}.png'
              canvas.save(path,format='PNG',optimize=True)
              verified=Image.open(path)
              verified.load()
              if verified.mode!='RGBA' or verified.size!=(1024,1024):
                  raise RuntimeError(f'{ident}: failed PNG output QA')
              print(f'PASS: prop_space_{ident}.png source={source.size} mode={source.mode} 1024x1024 RGBA true-alpha margin={margin}px bytes={path.stat().st_size}',flush=True)
              return ident
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              complete=list(executor.map(one,sources.items()))
          if sorted(complete)!=expected:
              raise SystemExit('FAIL: missing one or more numbered Orbit Drop assets')
          print('PASS: eight separate numbered Orbit Drop transparent PNGs imported and validated',flush=True)
          PY
      - name: Commit only eight prop PNGs and remove importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/raw/prop_space_*.png
          git rm .github/workflows/import-space-props.yml
          git commit -m "art: add eight premium Orbit Drop prop candidates"
          git push

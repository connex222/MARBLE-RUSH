name: Import twelve numbered Marble Rush swirl textures (one-time)
on:
  push:
    branches:
      - art/marble-swirls-01-12
    paths:
      - .github/workflows/import-marble-swirls.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download all 12 and validate circular texture alpha
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          import json, urllib.request, time, concurrent.futures
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageChops
          SOURCES=json.loads(r'''{
  "10": "https://cdn.creativeclaw.co/u/f3e7a3b1/images/e3d4fcc0-09ff-4a1c-9f2a-61fbeb4a10cb.png",
  "11": "https://cdn.creativeclaw.co/u/f3e7a3b1/images/6c4153cd-ccd0-4114-8aa0-df81a21226e5.png",
  "12": "https://cdn.creativeclaw.co/u/f3e7a3b1/images/2aadc349-bc61-4178-8cb9-862c938566c3.png",
  "01": "https://cdn.creativeclaw.co/u/f3e7a3b1/images/7848dccf-ebbd-4ac5-9dc3-733914a9069c.png",
  "02": "https://cdn.creativeclaw.co/u/f3e7a3b1/images/a611bdb8-2447-4fb5-8646-19de1cade5e0.png",
  "03": "https://cdn.creativeclaw.co/u/f3e7a3b1/images/6fa33313-3737-4a51-8506-e50df13cde06.png",
  "04": "https://cdn.creativeclaw.co/u/f3e7a3b1/images/81c76df5-a5ec-43b8-933d-ffd21763d8f4.png",
  "05": "https://cdn.creativeclaw.co/u/f3e7a3b1/images/39fad502-291f-4e74-ab3c-4906ff51b922.png",
  "06": "https://cdn.creativeclaw.co/u/f3e7a3b1/images/c3088a4f-b28a-4598-a32c-95f1d23652b8.png",
  "07": "https://cdn.creativeclaw.co/u/f3e7a3b1/images/0521cb0b-4e03-410b-a2fc-1f9592a043bb.png",
  "08": "https://cdn.creativeclaw.co/u/f3e7a3b1/images/4d3cfe31-c104-4aad-a84b-8eba42bae96c.png",
  "09": "https://cdn.creativeclaw.co/u/f3e7a3b1/images/f3d1a643-30e0-4c54-bbe7-e010f866d675.png"
}''')
          assert len(SOURCES)==12 and sorted(SOURCES)==[f'{i:02d}' for i in range(1,13)]
          DEST=Path('assets/raw')
          DEST.mkdir(parents=True,exist_ok=True)
          def get_and_process(pair):
              ident, url=pair
              data=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'MarbleRushArtImporter/1.0'})
                      with urllib.request.urlopen(req,timeout=75) as resp:
                          data=resp.read(18000000)
                      break
                  except Exception:
                      if attempt==2: raise
                      time.sleep(2*(attempt+1))
              if not (data and data.startswith(b'\x89PNG\r\n\x1a\n') and 10000<len(data)<17000000):
                  raise RuntimeError(f'{ident}: not a valid-sized PNG')
              image=Image.open(BytesIO(data))
              image.load()
              if image.size!=(1024,1024):
                  raise RuntimeError(f'{ident}: expected 1024x1024 image, got {image.size}')
              rgba=image.convert('RGBA')
              original_alpha=rgba.getchannel('A')
              original_range=original_alpha.getextrema()
              box=original_alpha.point(lambda v:255 if v>10 else 0).getbbox()
              if not box: raise RuntimeError(f'{ident}: empty image')
              if min(box[2]-box[0],box[3]-box[1])<600:
                  raise RuntimeError(f'{ident}: subject too small or incomplete: {box}')
              # Normalize generated circular pattern to fill the texture tile edge-to-edge.
              crop=rgba.crop(box)
              tile=crop.resize((1024,1024),Image.Resampling.LANCZOS)
              # Render exact circular alpha with subpixel anti-aliasing. Corners are fully transparent.
              side=4096
              stencil=Image.new('L',(side,side),0)
              ImageDraw.Draw(stencil).ellipse((0,0,side-1,side-1),fill=255)
              disk=stencil.resize((1024,1024),Image.Resampling.LANCZOS)
              # Preserve intentional alpha inside the glass while masking external pixels.
              src_a=tile.getchannel('A')
              new_alpha=ImageChops.multiply(src_a,disk)
              tile.putalpha(new_alpha)
              if any(tile.getpixel(pos)[3] for pos in [(0,0),(1023,0),(0,1023),(1023,1023)]):
                  raise RuntimeError(f'{ident}: corners not transparent')
              if tile.getpixel((512,512))[3]<8:
                  raise RuntimeError(f'{ident}: circle has empty centre')
              filename=DEST/f'marble_swirl_{ident}.png'
              tile.save(filename,format='PNG',optimize=True)
              verify=Image.open(filename)
              verify.load()
              if verify.size!=(1024,1024) or verify.mode!='RGBA':
                  raise RuntimeError(f'{ident}: invalid output PNG')
              print(f'PASS {ident}: 1024x1024 RGBA circular texture, transparent corners, original alpha={original_range}, source box={box}, {filename.stat().st_size} bytes',flush=True)
              return ident
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              ids=list(executor.map(get_and_process,SOURCES.items()))
          if sorted(ids)!=[f'{i:02d}' for i in range(1,13)]:
              raise SystemExit('Missing numbered asset(s)')
          print('PASS: ALL 12 individually numbered marble swirl PNGs verified',flush=True)
          PY
      - name: Commit 12 textures and remove the temporary importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/raw/marble_swirl_*.png
          git rm .github/workflows/import-marble-swirls.yml
          git commit -m "art: add twelve numbered glass marble swirl texture candidates"
          git push

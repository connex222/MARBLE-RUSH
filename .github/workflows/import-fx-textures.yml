name: Generate and QA MARBLE RUSH ten premium FX textures (one-time)
# Revised to keep all soft smoke/glow tails clear of texture boundaries.
on:
  push:
    branches:
      - art/fx-textures-01-10
    paths:
      - .github/workflows/import-fx-textures.yml
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install raster FX tooling
        run: python -m pip -q install Pillow numpy
      - name: Produce 10 original, alpha-transparent visual effects from deterministic curves
        run: python tools/_make_fx_art.py
      - name: Validate unique art filenames and transparent edges
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from PIL import Image
          names=['fx_sparkle','fx_glow','fx_spark','fx_dust','fx_sprinkle','fx_frost','fx_splash','fx_poof','fx_star_burst','fx_wind']
          folder=Path('assets/raw')
          digest=[]
          for name in names:
              path=folder/(name+'.png')
              assert path.is_file(),f'Missing: {path}'
              img=Image.open(path);img.load()
              assert img.format=='PNG' and img.mode=='RGBA'
              expected=(1536,1024) if name=='fx_wind' else (1024,1024)
              assert img.size==expected,f'Wrong size for {name}: {img.size}'
              a=img.getchannel('A')
              assert a.getextrema()[0]==0 and a.getextrema()[1]>=90
              x0,y0,x1,y1=a.getbbox()
              assert min(x0,y0,expected[0]-x1,expected[1]-y1)>=28
              digest.append(hashlib.sha256(path.read_bytes()).hexdigest())
              print(f'PASS: {name}, {img.size}, alpha={a.getextrema()}, byte_size={path.stat().st_size}')
          assert len(set(digest))==10,'Unexpected duplicate texture renders'
          print('PASS: all ten completely distinct VFX images match the Master Bible filenames and alpha contract')
          PY
      - name: Commit only 10 final art PNGs and remove importer and staging generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/raw/fx_sparkle.png assets/raw/fx_glow.png assets/raw/fx_spark.png assets/raw/fx_dust.png assets/raw/fx_sprinkle.png assets/raw/fx_frost.png assets/raw/fx_splash.png assets/raw/fx_poof.png assets/raw/fx_star_burst.png assets/raw/fx_wind.png
          git rm .github/workflows/import-fx-textures.yml tools/_make_fx_art.py
          git commit -m "art: add ten unique premium transparent VFX texture candidates"
          git push

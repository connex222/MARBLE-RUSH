name: Import seamless Candy Cascade rail texture (one-time)
on:
  push:
    branches:
      - art/tex-rail-candy
    paths:
      - .github/workflows/import-tex-rail-candy.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Import, seam-blend and QA candy rail PNG
        env:
          IMAGE_URL: https://cdn.creativeclaw.co/u/f3e7a3b1/images/c811e26e-f717-47db-bdcf-cd9fa2b73914.png
        run: |
          python -m pip -q install Pillow numpy
          python - <<'PY'
          import os, urllib.request
          from io import BytesIO
          from pathlib import Path
          import numpy as np
          from PIL import Image
          request=urllib.request.Request(os.environ['IMAGE_URL'],headers={'User-Agent':'MarbleRushTextureImporter/1.0'})
          with urllib.request.urlopen(request,timeout=60) as response:
              data=response.read(18000000)
          if not data.startswith(b'\x89PNG\r\n\x1a\n') or not 15000<len(data)<17000000:
              raise SystemExit('FAIL: invalid or unexpected PNG source')
          raw=Image.open(BytesIO(data))
          raw.load()
          if raw.size!=(1024,1024):
              raise SystemExit(f'FAIL: expected 1024x1024, received {raw.size}')
          rgb=raw.convert('RGB')
          arr=np.asarray(rgb,dtype=np.float32).copy()
          if arr.std()<12:
              raise SystemExit('FAIL: source almost uniformly coloured')
          # Make exact edge continuity for wrapping along the racing track.
          # Preserve the original striped image in the centre of the square.
          band=64
          for x in range(band):
              weight=.5*(1.0-x/(band-1))
              first=arr[:,x,:].copy()
              last=arr[:,-1-x,:].copy()
              arr[:,x,:]=(1-weight)*first+weight*last
              arr[:,-1-x,:]=(1-weight)*last+weight*first
          for y in range(band):
              weight=.5*(1.0-y/(band-1))
              first=arr[y,:,:].copy()
              last=arr[-1-y,:,:].copy()
              arr[y,:,:]=(1-weight)*first+weight*last
              arr[-1-y,:,:]=(1-weight)*last+weight*first
          output=Image.fromarray(np.clip(np.rint(arr),0,255).astype('uint8'),'RGB')
          pix=np.asarray(output,dtype=np.int16)
          lr=int(np.max(np.abs(pix[:,0,:]-pix[:,-1,:])))
          tb=int(np.max(np.abs(pix[0,:,:]-pix[-1,:,:])))
          centre_std=float(np.asarray(rgb.crop((100,100,924,924))).std())
          print('SOURCE:',raw.size,raw.mode,'CENTRE_STD:',round(centre_std,2))
          print('OUTPUT:',output.size,output.mode)
          print('SEAM MAX DIFF: left/right',lr,'top/bottom',tb)
          if lr>1 or tb>1: raise SystemExit('FAIL: unequal opposing edge pixels')
          dest=Path('assets/raw/tex_rail_candy.png')
          dest.parent.mkdir(parents=True,exist_ok=True)
          output.save(dest,format='PNG',optimize=True)
          checked=Image.open(dest)
          checked.load()
          if checked.size!=(1024,1024) or checked.mode!='RGB':
              raise SystemExit('FAIL: saved asset invalid')
          print('PASS: one opaque 1024x1024 seamless candy rail texture PNG')
          print('BYTES:',dest.stat().st_size)
          PY
      - name: Commit checked texture and remove temporary importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/raw/tex_rail_candy.png
          git rm .github/workflows/import-tex-rail-candy.yml
          git commit -m "art: add Candy Cascade seamlessly tileable rail texture"
          git push

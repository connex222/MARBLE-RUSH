name: Import Clockwork Chaos cinematic background (one-time)
on:
  push:
    branches:
      - art/bg-far-clockwork
    paths:
      - .github/workflows/import-bg-far-clockwork.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Import and validate Clockwork Chaos far background
        env:
          IMAGE_URL: https://cdn.creativeclaw.co/u/f3e7a3b1/images/40822300-0b40-4588-bdb7-926dcf3f8494.png
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          import os,urllib.request
          from io import BytesIO
          from pathlib import Path
          from PIL import Image,ImageOps,ImageStat
          req=urllib.request.Request(os.environ['IMAGE_URL'],headers={'User-Agent':'MarbleRushClockworkImporter/1.0'})
          with urllib.request.urlopen(req,timeout=70) as response:
              data=response.read(30000000)
          if not data.startswith(b'\x89PNG\r\n\x1a\n') or not 20000<len(data)<29000000:
              raise SystemExit('FAIL: source is missing or not PNG')
          src=Image.open(BytesIO(data));src.load()
          if not 1000<=src.width<=5000 or not 700<=src.height<=5000:
              raise SystemExit(f'FAIL: unexpected dimensions {src.size}')
          if not 1.25<=src.width/src.height<=1.9:
              raise SystemExit(f'FAIL: wrong landscape ratio {src.size}')
          scene=ImageOps.fit(src.convert('RGB'),(1536,1024),Image.Resampling.LANCZOS,centering=(0.5,0.5))
          if max(ImageStat.Stat(scene).stddev)<4:
              raise SystemExit('FAIL: visually uniform background')
          dest=Path('assets/raw/bg_far_clockwork.png')
          dest.parent.mkdir(parents=True,exist_ok=True)
          scene.save(dest,format='PNG',optimize=True)
          check=Image.open(dest);check.load()
          if check.size!=(1536,1024) or check.mode!='RGB':
              raise SystemExit('FAIL: saved picture not 1536x1024 RGB')
          print('SOURCE:',src.size,src.mode)
          print('PASS: Clockwork Chaos full-bleed opaque 1536x1024 cinematic background PNG')
          print('BYTES:',dest.stat().st_size)
          PY
      - name: Commit art-only file and remove one-time importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/raw/bg_far_clockwork.png
          git rm .github/workflows/import-bg-far-clockwork.yml
          git commit -m "art: add Victorian Clockwork Chaos far background candidate"
          git push

name: Import eight Seaside Sprint props (one-time)
on:
  push:
    branches:
      - art/seaside-props-01-08
    paths:
      - .github/workflows/import-seaside-props.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Import and QA all eight separately numbered seaside prop PNGs
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          import json,urllib.request,concurrent.futures,time,hashlib
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          urls=json.loads(r'''{"01":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/a5a2f3b7-dcd8-4302-9d06-97bb91ce39f9.png","02":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/bfc450b4-4c8a-4025-abb2-4dcc2f68beef.png","03":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/fd8b64c3-173d-4c5b-9d93-4faaccf5f387.png","04":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/cfee112d-73da-4a1c-9f89-d1f8926d80df.png","05":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/e433f389-d1e1-47fb-b03a-20b6ea8bafe8.png","06":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/038787a2-fff4-44b3-93b7-2f2046f156e5.png","07":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/802d8bc7-b8e8-4a82-8c35-94d443024398.png","08":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/fd70efdb-9475-4017-bd8f-5fb229f2a9d2.png"}''')
          expected=[f'{i:02d}' for i in range(1,9)]
          if sorted(urls)!=expected:raise SystemExit('FAIL: expected eight numbered sources')
          folder=Path('assets/raw')
          folder.mkdir(parents=True,exist_ok=True)
          def convert(item):
              ident,url=item
              blob=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'MarbleRushArtImporter/1.0'})
                      with urllib.request.urlopen(req,timeout=75) as response:
                          blob=response.read(30000000)
                      break
                  except Exception:
                      if attempt==2:raise
                      time.sleep((attempt+1)*2)
              if not blob or not blob.startswith(b'\x89PNG\r\n\x1a\n') or not 10000<len(blob)<29000000:
                  raise RuntimeError(f'{ident}: source not PNG')
              image=Image.open(BytesIO(blob))
              image.load()
              if not (500<=min(image.size) and max(image.size)<=4096):
                  raise RuntimeError(f'{ident}: invalid source size {image.size}')
              rgba=image.convert('RGBA')
              alpha=rgba.getchannel('A')
              if alpha.getextrema()[0]==255:
                  raise RuntimeError(f'{ident}: source has no alpha')
              bbox=alpha.point(lambda v: 255 if v>10 else 0).getbbox()
              if bbox is None:raise RuntimeError(f'{ident}: no visible object')
              subject=rgba.crop(bbox)
              factor=min(860.0/subject.width,860.0/subject.height)
              size=(max(1,round(subject.width*factor)),max(1,round(subject.height*factor)))
              subject=subject.resize(size,Image.Resampling.LANCZOS)
              canvas=Image.new('RGBA',(1024,1024),(0,0,0,0))
              canvas.alpha_composite(subject,((1024-size[0])//2,(1024-size[1])//2))
              box=canvas.getchannel('A').getbbox()
              margin=min(box[0],box[1],1024-box[2],1024-box[3])
              if margin<79:
                  raise RuntimeError(f'{ident}: object lacks 8% clear margin ({margin}px)')
              path=folder/f'prop_seaside_{ident}.png'
              canvas.save(path,format='PNG',optimize=True)
              check=Image.open(path)
              check.load()
              if check.mode!='RGBA' or check.size!=(1024,1024) or check.getpixel((0,0))[3]!=0:
                  raise RuntimeError(f'{ident}: saved PNG did not pass RGBA/margin check')
              print(f'PASS: prop_seaside_{ident}.png; src={image.size} 1024x1024 RGBA margin={margin}px bytes={path.stat().st_size}',flush=True)
              return ident
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              result=list(pool.map(convert,urls.items()))
          if sorted(result)!=expected:raise SystemExit('FAIL: wrong count')
          fingerprints=[hashlib.sha256((folder/f'prop_seaside_{i}.png').read_bytes()).hexdigest() for i in expected]
          if len(set(fingerprints))!=8:raise SystemExit('FAIL: duplicate output images')
          print('PASS: 8/8 unique transparent and individually numbered Seaside Sprint props',flush=True)
          PY
      - name: Commit art-only files and self-remove importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/raw/prop_seaside_*.png
          git rm .github/workflows/import-seaside-props.yml
          git commit -m "art: add eight premium Seaside Sprint prop candidates"
          git push

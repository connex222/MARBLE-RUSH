name: Import Orbit Drop cinematic background (one-time)
on:
  push:
    branches:
      - art/bg-far-space
    paths:
      - .github/workflows/import-bg-far-space.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Download, fit to 3 by 2 and validate premium space-station background
        env:
          IMAGE_URL: https://cdn.creativeclaw.co/u/f3e7a3b1/images/0d8ac251-6ec6-41bc-9d3d-15bf69596da2.png
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          import os,urllib.request
          from io import BytesIO
          from pathlib import Path
          from PIL import Image,ImageOps,ImageStat
          req=urllib.request.Request(os.environ['IMAGE_URL'],headers={'User-Agent':'MarbleRushArtImporter/1.0'})
          with urllib.request.urlopen(req,timeout=60) as response:
              data=response.read(24000000)
          if not data.startswith(b'\x89PNG\r\n\x1a\n') or not 20000<len(data)<23000000:
              raise SystemExit('FAIL: invalid PNG source')
          raw=Image.open(BytesIO(data))
          raw.load()
          if min(raw.size)<1000 or max(raw.size)>5000:
              raise SystemExit(f'FAIL: unexpected source dimensions {raw.size}')
          if raw.width/raw.height<1.2 or raw.width/raw.height>2.0:
              raise SystemExit('FAIL: source aspect ratio too different')
          # Preserve the image's full horizontal framing. Trim only the top
          # and bottom as necessary to obtain the Bible's required 3:2 shape.
          background=ImageOps.fit(raw.convert('RGB'),(1536,1024),Image.Resampling.LANCZOS,centering=(0.5,0.5))
          if max(ImageStat.Stat(background).stddev)<4:
              raise SystemExit('FAIL: almost uniformly coloured')
          path=Path('assets/raw/bg_far_space.png')
          path.parent.mkdir(parents=True,exist_ok=True)
          background.save(path,format='PNG',optimize=True)
          check=Image.open(path);check.load()
          if check.mode!='RGB' or check.size!=(1536,1024):
              raise SystemExit('FAIL: invalid 1536x1024 RGB output')
          print('SOURCE:',raw.size,raw.mode)
          print('PASS: 1536x1024 full-bleed opaque RGB Orbit Drop background')
          print('BYTES:',path.stat().st_size)
          PY
      - name: Commit art-only asset and remove importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/raw/bg_far_space.png
          git rm .github/workflows/import-bg-far-space.yml
          git commit -m "art: add Orbit Drop cinematic space-station background candidate"
          git push

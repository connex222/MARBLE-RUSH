name: Phase 8 Party Pack integration QA
on:
  push:
    branches:
      - dev/party-pack-phase8-final-polish
  pull_request:
    paths:
      - 'src/**'
      - 'tools/test-phase8-integration.js'
      - 'tests/phase7-golf.test.js'
      - 'package.json'
      - '.github/workflows/phase8-party-qa.yml'
permissions:
  contents: read
jobs:
  phase8:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Check game syntax
        run: |
          node --check src/tv.js
          node --check tools/test-phase8-integration.js
          for f in src/modes/*.js; do node --check "$f"; done
      - name: Verify five replacement stages and legacy screen removal
        run: node tools/test-phase8-integration.js
      - name: Simulate both five- and nine-hole Golf championships
        run: |
          node tests/phase7-golf.test.js
          node tools/test-golf.js
      - name: Validate all previous Party Pack modes
        run: |
          npm run test:party
          npm run test:dropzone
          npm run test:brawl
          npm run test:derby
          npm run test:curling
      - name: Build TV/phone assets
        run: npm run build
      - name: Check compiled Golf controls
        run: |
          node - <<'NODE'
          const fs=require('fs'), assert=require('assert');
          const tv=fs.readFileSync('public/tv.html','utf8'), phone=fs.readFileSync('public/play.html','utf8');
          assert(tv.includes('data-screen="party-stage"'));
          assert(tv.includes('MODES[mode].tick(dt)'));
          assert(tv.includes('MarblePartyScreen.render(mode,session.state'));
          assert(tv.includes('MarbleSceneCache.paint'));
          assert(!tv.includes('MarblePartyStage'));
          assert(tv.includes('id="ppGolfShoot"'));
          assert(tv.includes('MarbleGolfUI.draw'));
          assert(phone.includes("case 'golf':"));
          assert(!tv.includes('/*MODES*/'));
          console.log('PASS: compiled exclusive Golf v2 TV/phone controls and no retired screen');
          NODE
      - name: Preserve build artefacts for acceptance
        uses: actions/upload-artifact@v4
        with:
          name: marble-rush-phase8-integration-preview
          retention-days: 7
          path: |
            public/
            docs/PARTY-PHASE8.md

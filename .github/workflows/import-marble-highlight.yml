name: Import glass-marble highlight overlay (one-time)
on:
  push:
    branches:
      - art/marble-highlight
    paths:
      - .github/workflows/import-marble-highlight.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download and QA transparent glass highlight PNG
        env:
          IMAGE_URL: https://cdn.creativeclaw.co/u/f3e7a3b1/images/aae55621-7fb3-4764-b7ee-2ff17ea77740.png
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          import os, urllib.request
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageChops
          req=urllib.request.Request(os.environ['IMAGE_URL'],headers={'User-Agent':'MarbleRushArtImporter/1.0'})
          with urllib.request.urlopen(req, timeout=45) as response:
              data=response.read(17000000)
          if not data.startswith(b'\x89PNG\r\n\x1a\n') or not 10000<len(data)<16500000:
              raise SystemExit('FAIL: invalid PNG source')
          original=Image.open(BytesIO(data));original.load()
          if original.size!=(1024,1024):
              raise SystemExit(f'FAIL: unexpected input size {original.size}')
          image=original.convert('RGBA')
          a=image.getchannel('A')
          hist=a.histogram()
          transparency_ratio=sum(hist[:16])/1048576
          centre=a.crop((440,440,584,584))
          centre_mean=sum(int(i)*n for i,n in enumerate(centre.histogram()))/(144*144)
          print('SOURCE:',original.mode,'alpha range:',a.getextrema(),'almost-transparent pixel ratio:',round(transparency_ratio,3),'centre mean alpha:',round(centre_mean,1))
          if a.getextrema()[0]==255:
              raise SystemExit('FAIL: flat opaque background (no transparency)')
          # Critical: a glass highlight overlay must not hide the rotating colour swirls.
          if centre_mean > 55 or transparency_ratio < 0.40:
              raise SystemExit('FAIL: source has too much opacity; requires isolated shine, not an opaque sphere')
          # Clip any edge leaks to an anti-aliased circular footprint, retaining authored shine.
          mask=Image.new('L',(4096,4096),0)
          ImageDraw.Draw(mask).ellipse((0,0,4095,4095),fill=255)
          disk=mask.resize((1024,1024),Image.Resampling.LANCZOS)
          image.putalpha(ImageChops.multiply(a,disk))
          if any(image.getpixel(corner)[3] for corner in [(0,0),(1023,0),(0,1023),(1023,1023)]):
              raise SystemExit('FAIL: corners must be transparent')
          box=image.getchannel('A').getbbox()
          if not box: raise SystemExit('FAIL: no highlight elements')
          dst=Path('assets/raw/marble_highlight.png')
          dst.parent.mkdir(parents=True,exist_ok=True)
          image.save(dst,format='PNG',optimize=True)
          again=Image.open(dst); again.load()
          if again.mode != 'RGBA' or again.size != (1024,1024):
              raise SystemExit('FAIL: invalid output PNG')
          print('FINAL:',again.size,again.mode,'alpha bbox:',box,'bytes:',dst.stat().st_size)
          print('PASS: clear centred 1024x1024 RGBA shine overlay with transparent corners and unobstructed centre')
          PY
      - name: Commit art-only overlay, remove the temporary importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/raw/marble_highlight.png
          git rm .github/workflows/import-marble-highlight.yml
          git commit -m "art: add stationary glass-marble shine overlay"
          git push

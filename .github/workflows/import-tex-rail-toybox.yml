name: Import seamless Toy Box Tumble rail texture (one-time)
on:
  push:
    branches:
      - art/tex-rail-toybox
    paths:
      - .github/workflows/import-tex-rail-toybox.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Import, edge-blend and QA seamless pine texture
        env:
          IMAGE_URL: https://cdn.creativeclaw.co/u/f3e7a3b1/images/344228f4-eeb9-4f2f-949b-1f19e2ce78c6.png
        run: |
          python -m pip -q install Pillow numpy
          python - <<'PY'
          import os, urllib.request
          from io import BytesIO
          from pathlib import Path
          import numpy as np
          from PIL import Image, ImageStat
          req=urllib.request.Request(os.environ['IMAGE_URL'],headers={'User-Agent':'MarbleRushArtImporter/1.0'})
          with urllib.request.urlopen(req,timeout=50) as response:
              data=response.read(17000000)
          if not data.startswith(b'\x89PNG\r\n\x1a\n') or not 15000<len(data)<16000000:
              raise SystemExit('FAIL: invalid or unexpected PNG input')
          source=Image.open(BytesIO(data))
          source.load()
          if source.size != (1024,1024):
              raise SystemExit(f'FAIL: expected square 1024 texture, received {source.size}')
          rgb=source.convert('RGB')
          arr=np.asarray(rgb,dtype=np.float32).copy()
          if arr.std()<5: raise SystemExit('FAIL: texture is almost flat colour')
          band=64
          # Blend opposite edges into each other over 64 px to create a
          # continuous material tile, while retaining the inner woodgrain.
          for x in range(band):
              strength=0.5*(1.0-x/(band-1))
              other=arr[:,-1-x,:].copy()
              current=arr[:,x,:].copy()
              arr[:,x,:]=(1-strength)*current+strength*other
              arr[:,-1-x,:]=(1-strength)*other+strength*current
          for y in range(band):
              strength=0.5*(1.0-y/(band-1))
              other=arr[-1-y,:,:].copy()
              current=arr[y,:,:].copy()
              arr[y,:,:]=(1-strength)*current+strength*other
              arr[-1-y,:,:]=(1-strength)*other+strength*current
          output=Image.fromarray(np.clip(np.rint(arr),0,255).astype('uint8'),'RGB')
          tile=np.asarray(output,dtype=np.int16)
          lr=int(np.max(np.abs(tile[:,0,:]-tile[:,-1,:])))
          tb=int(np.max(np.abs(tile[0,:,:]-tile[-1,:,:])))
          mean=[round(float(v),2) for v in tile.mean(axis=(0,1))]
          print('SOURCE:',source.size,source.mode,'STD:',round(float(np.asarray(rgb).std()),2))
          print('OUTPUT:',output.size,output.mode,'mean RGB:',mean)
          print('SEAM MAX DIFF: left/right',lr,'top/bottom',tb)
          if lr>1 or tb>1:
              raise SystemExit('FAIL: texture has discontinuous edges')
          target=Path('assets/raw/tex_rail_toybox.png')
          target.parent.mkdir(parents=True,exist_ok=True)
          output.save(target,format='PNG',optimize=True)
          verify=Image.open(target)
          verify.load()
          if verify.size!=(1024,1024) or verify.mode!='RGB':
              raise SystemExit('FAIL: saved tile invalid')
          print('PASS: one opaque 1024x1024 PNG with seamless matching opposite edges')
          print('bytes:',target.stat().st_size)
          PY
      - name: Commit tested texture and remove importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/raw/tex_rail_toybox.png
          git rm .github/workflows/import-tex-rail-toybox.yml
          git commit -m "art: add seamlessly tiled polished pine Toy Box rail texture"
          git push

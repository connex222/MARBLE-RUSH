name: Verify Captain Clatter PNG transparency (one-time)
on:
  push:
    branches:
      - art/captain-clatter-reference
    paths:
      - .github/workflows/check-clatter-png.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect alpha channel and safe area
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          from PIL import Image
          path = 'assets/raw/clatter_reference.png'
          im = Image.open(path)
          im.load()
          print('size:', im.size, 'mode:', im.mode)
          print('transparent-info:', im.info.get('transparency'))
          if im.size[0] != im.size[1] or im.size[0] < 900:
              raise SystemExit('FAIL: not a high-resolution square')
          rgba = im.convert('RGBA')
          a = rgba.getchannel('A')
          print('alpha min/max:', a.getextrema())
          print('alpha bbox:', a.getbbox())
          if a.getextrema()[0] == 255:
              raise SystemExit('FAIL: image is fully opaque, transparency required')
          b = a.getbbox()
          w,h = im.size
          if not b or b[0]<w*0.03 or b[1]<h*0.03 or b[2]>w*0.97 or b[3]>h*0.97:
              print('WARNING: asset touches safe area; review crop margins')
          print('PASS: transparency present')
          PY
      - name: Remove this temporary QA workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/check-clatter-png.yml
          git commit -m "chore: remove one-time Captain Clatter QA workflow"
          git push

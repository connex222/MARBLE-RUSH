name: Import Clatter cheer artwork (one-time)
on:
  push:
    branches:
      - art/clatter-cheer
    paths:
      - .github/workflows/import-clatter-cheer.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate cheer pose image
        env:
          IMAGE_URL: https://cdn.creativeclaw.co/u/f3e7a3b1/images/2ebbe373-0fd1-47a0-b00b-6bf355f6b787.png
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          import os, urllib.request
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          req=urllib.request.Request(os.environ['IMAGE_URL'],headers={'User-Agent':'MarbleRushArtImporter/1.0'})
          with urllib.request.urlopen(req,timeout=45) as response:
              data=response.read(16000000)
          if not data.startswith(b'\x89PNG\r\n\x1a\n') or not 10000<len(data)<15000000:
              raise SystemExit('FAIL: generated asset is not a valid PNG')
          raw=Image.open(BytesIO(data))
          raw.load()
          if raw.size!=(1024,1024):
              raise SystemExit(f'FAIL: expected 1024x1024, got {raw.size}')
          im=raw.convert('RGBA')
          alpha=im.getchannel('A')
          if alpha.getextrema()[0]==255:
              raise SystemExit('FAIL: image lacks real transparency')
          bbox=alpha.getbbox()
          if not bbox: raise SystemExit('FAIL: completely transparent asset')
          subject=im.crop(bbox)
          w,h=subject.size
          scale=min(860/w,860/h,1.0)
          nw,nh=round(w*scale),round(h*scale)
          if (nw,nh)!=(w,h):
              subject=subject.resize((nw,nh),Image.Resampling.LANCZOS)
          out=Image.new('RGBA',(1024,1024),(0,0,0,0))
          out.alpha_composite(subject,((1024-nw)//2,(1024-nh)//2))
          final_bbox=out.getchannel('A').getbbox()
          margin=min(final_bbox[0],final_bbox[1],1024-final_bbox[2],1024-final_bbox[3])
          print('SOURCE',raw.size,raw.mode,'ALPHA RANGE',alpha.getextrema(),'BBOX',bbox)
          print('NORMALIZED',out.size,out.mode,'BBOX',final_bbox,'MARGIN',margin)
          if margin<79: raise SystemExit('FAIL: expected at least 8 percent safe margin')
          dest=Path('assets/raw/clatter_cheer.png')
          dest.parent.mkdir(parents=True,exist_ok=True)
          out.save(dest,format='PNG',optimize=True)
          print('PASS: single transparent 1024x1024 character image, >=8% blank border')
          PY
      - name: Commit image and remove one-time importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/raw/clatter_cheer.png
          git rm .github/workflows/import-clatter-cheer.yml
          git commit -m "art: add Captain Clatter cheering pose PNG"
          git push

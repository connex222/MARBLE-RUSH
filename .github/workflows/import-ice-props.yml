name: Import eight Frosty Freefall props (one-time)
on:
  push:
    branches:
      - art/ice-props-01-08
    paths:
      - .github/workflows/import-ice-props.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Import individual PNG props, resize and validate transparency
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          import json,urllib.request,concurrent.futures,time
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          urls=json.loads(r'''{"01":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/c87d7926-5daf-46fe-aace-04204dcb3651.png","02":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/a7fbef12-c30d-4a07-ab7b-b33b3c20199c.png","03":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/69d81f0a-decf-4851-b168-fee5a48e2782.png","04":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/cff90255-71b4-4fce-94cd-be5c4be02543.png","05":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/bddf7bb1-b205-4125-996c-84e5fa4a91f5.png","06":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/1ca16170-1732-4572-a44c-d4fcddeebefe.png","07":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/dc1ba375-b1c7-4b48-9a31-46e6624e11c2.png","08":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/f5dbd60b-3551-46ec-9d2d-690ec8447abe.png"}''')
          ids=[f'{i:02d}' for i in range(1,9)]
          assert sorted(urls)==ids
          folder=Path('assets/raw')
          folder.mkdir(parents=True,exist_ok=True)
          def handle(item):
              ident,url=item
              data=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'MarbleRushAssetsImporter/1.0'})
                      with urllib.request.urlopen(req,timeout=75) as resp:
                          data=resp.read(30000000)
                      break
                  except Exception:
                      if attempt==2:raise
                      time.sleep((attempt+1)*2)
              if not data or not data.startswith(b'\x89PNG\r\n\x1a\n') or not 10000<len(data)<29000000:
                  raise RuntimeError(f'{ident}: source not a valid PNG')
              source=Image.open(BytesIO(data))
              source.load()
              if max(source.size)>4096 or min(source.size)<500:
                  raise RuntimeError(f'{ident}: implausible image size {source.size}')
              rgba=source.convert('RGBA')
              alpha=rgba.getchannel('A')
              if alpha.getextrema()[0]==255:
                  raise RuntimeError(f'{ident}: source is opaque; real transparency required')
              bbox=alpha.point(lambda a:255 if a>10 else 0).getbbox()
              if not bbox:
                  raise RuntimeError(f'{ident}: subject missing')
              crop=rgba.crop(bbox)
              width,height=crop.size
              factor=min(860/width,860/height)
              nw,nh=max(1,round(width*factor)),max(1,round(height*factor))
              crop=crop.resize((nw,nh),Image.Resampling.LANCZOS)
              output=Image.new('RGBA',(1024,1024),(0,0,0,0))
              output.alpha_composite(crop,((1024-nw)//2,(1024-nh)//2))
              bb=output.getchannel('A').getbbox()
              margin=min(bb[0],bb[1],1024-bb[2],1024-bb[3])
              if margin<79:raise RuntimeError(f'{ident}: margin too narrow {margin}px')
              path=folder/f'prop_ice_{ident}.png'
              output.save(path,format='PNG',optimize=True)
              chk=Image.open(path)
              chk.load()
              if chk.mode!='RGBA' or chk.size!=(1024,1024):
                  raise RuntimeError(f'{ident}: saved image failed validation')
              print(f'PASS: prop_ice_{ident}.png source={source.size} alpha={alpha.getextrema()} 1024x1024 RGBA margin={margin} bytes={path.stat().st_size}',flush=True)
              return ident
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              done=list(pool.map(handle,urls.items()))
          if sorted(done)!=ids:raise SystemExit('Not all 8 PNGs present')
          print('PASS: all eight individually numbered Frosty Freefall RGBA PNGs',flush=True)
          PY
      - name: Commit assets and remove one-time importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/raw/prop_ice_*.png
          git rm .github/workflows/import-ice-props.yml
          git commit -m "art: add eight premium Frosty Freefall decorative prop candidates"
          git push

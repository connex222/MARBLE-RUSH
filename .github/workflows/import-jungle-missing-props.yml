name: Import missing Jungle Jumble props 05–08 (one-time)
on:
  push:
    branches:
      - art/jungle-missing-props-05-08
    paths:
      - .github/workflows/import-jungle-missing-props.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Import four required Jungle Jumble assets and validate PNGs
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          import json,urllib.request,time,concurrent.futures
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          sources=json.loads(r'''{"05":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/41a0e02b-70fa-4136-abc5-e1172ca81334.png","06":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/ddbfaa16-64bf-4e7e-a8e0-25bad899ea2b.png","07":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/b58d87b2-d9e7-4c24-87d9-cc0a81bd0925.png","08":"https://cdn.creativeclaw.co/u/f3e7a3b1/images/2776148c-57a5-4d4c-b617-b58feaee34ec.png"}''')
          expected=['05','06','07','08']
          assert sorted(sources)==expected
          folder=Path('assets/raw')
          folder.mkdir(parents=True,exist_ok=True)
          def load(entry):
              ident,url=entry
              data=None
              for attempt in range(3):
                  try:
                      request=urllib.request.Request(url,headers={'User-Agent':'MarbleRushArtImporter/1.0'})
                      with urllib.request.urlopen(request,timeout=70) as response:
                          data=response.read(30000000)
                      break
                  except Exception:
                      if attempt==2:raise
                      time.sleep(2*(attempt+1))
              if not data or not data.startswith(b'\x89PNG\r\n\x1a\n') or not 10000<len(data)<29000000:
                  raise RuntimeError(f'{ident}: invalid PNG input')
              source=Image.open(BytesIO(data));source.load()
              if not 500<=min(source.size) or max(source.size)>4096:
                  raise RuntimeError(f'{ident}: invalid source image dimensions {source.size}')
              rgba=source.convert('RGBA')
              alpha=rgba.getchannel('A')
              if alpha.getextrema()[0]==255:raise RuntimeError(f'{ident}: image not transparent')
              bbox=alpha.point(lambda a:255 if a>10 else 0).getbbox()
              if not bbox:raise RuntimeError(f'{ident}: subject missing')
              crop=rgba.crop(bbox)
              w,h=crop.size
              scale=min(860/w,860/h)
              target_size=(max(1,round(w*scale)),max(1,round(h*scale)))
              crop=crop.resize(target_size,Image.Resampling.LANCZOS)
              out=Image.new('RGBA',(1024,1024),(0,0,0,0))
              out.alpha_composite(crop,((1024-crop.width)//2,(1024-crop.height)//2))
              bounds=out.getchannel('A').getbbox()
              margin=min(bounds[0],bounds[1],1024-bounds[2],1024-bounds[3])
              if margin<79:raise RuntimeError(f'{ident}: image too close to edge, margin {margin}px')
              target=folder/f'prop_jungle_{ident}.png'
              out.save(target,format='PNG',optimize=True)
              verified=Image.open(target);verified.load()
              if verified.mode!='RGBA' or verified.size!=(1024,1024):
                  raise RuntimeError(f'{ident}: invalid saved output')
              print(f'PASS: prop_jungle_{ident}.png 1024x1024 RGBA alpha={alpha.getextrema()} margin={margin}px bytes={target.stat().st_size}',flush=True)
              return ident
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              results=list(executor.map(load,sources.items()))
          if sorted(results)!=expected:raise SystemExit('FAIL: missing outputs')
          print('PASS: all four missing Master Bible Jungle Jumble props 05–08 uploaded and validated',flush=True)
          PY
      - name: Commit checked PNGs, remove one-time importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/raw/prop_jungle_0[5-8].png
          git rm .github/workflows/import-jungle-missing-props.yml
          git commit -m "art: add missing Jungle Jumble props 05-08 for visual approval"
          git push

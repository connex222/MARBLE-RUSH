name: Import Seaside Sprint cinematic far background (one-time)
on:
  push:
    branches:
      - art/bg-far-seaside
    paths:
      - .github/workflows/import-bg-far-seaside.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Download and QA British seaside far background
        env:
          IMAGE_URL: https://cdn.creativeclaw.co/u/f3e7a3b1/images/bbf80918-f44a-4a85-9eb1-3266ace7bbf6.png
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          import os,urllib.request
          from io import BytesIO
          from pathlib import Path
          from PIL import Image,ImageOps,ImageStat
          request=urllib.request.Request(os.environ['IMAGE_URL'],headers={'User-Agent':'MarbleRushSeasideArtImporter/1.0'})
          with urllib.request.urlopen(request,timeout=65) as response:
              data=response.read(28000000)
          if not data.startswith(b'\x89PNG\r\n\x1a\n') or not 20000<len(data)<27000000:
              raise SystemExit('FAIL: source is not a valid PNG')
          src=Image.open(BytesIO(data));src.load()
          if not (1000<=src.width<=5000 and 700<=src.height<=5000):
              raise SystemExit(f'FAIL: wrong dimensions {src.size}')
          if not (1.25 <= src.width/src.height <= 1.90):
              raise SystemExit(f'FAIL: wrong landscape aspect {src.size}')
          background=ImageOps.fit(src.convert('RGB'),(1536,1024),Image.Resampling.LANCZOS,centering=(0.5,0.5))
          if max(ImageStat.Stat(background).stddev)<4:
              raise SystemExit('FAIL: almost uniform picture')
          path=Path('assets/raw/bg_far_seaside.png')
          path.parent.mkdir(parents=True,exist_ok=True)
          background.save(path,format='PNG',optimize=True)
          check=Image.open(path);check.load()
          if check.mode!='RGB' or check.size!=(1536,1024):
              raise SystemExit('FAIL: saved background dimensions or mode invalid')
          print('SOURCE:',src.size,src.mode)
          print('PASS: Seaside Sprint full-bleed cinematic far background 1536x1024 opaque RGB PNG')
          print('BYTES:',path.stat().st_size)
          PY
      - name: Commit art-only asset and remove one-time importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/raw/bg_far_seaside.png
          git rm .github/workflows/import-bg-far-seaside.yml
          git commit -m "art: add cinematic Seaside Sprint far background candidate"
          git push

name: Normalize Captain Clatter safe margins (one-time)
on:
  push:
    branches:
      - art/captain-clatter-reference
    paths:
      - .github/workflows/normalize-clatter-margins.yml
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set subject to 8-percent alpha safe area
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          path=Path('assets/raw/clatter_reference.png')
          im=Image.open(path).convert('RGBA')
          if im.size!=(1024,1024): raise SystemExit('Invalid original canvas')
          bbox=im.getchannel('A').getbbox()
          if not bbox: raise SystemExit('Empty alpha')
          subject=im.crop(bbox)
          w,h=subject.size
          maxdim=860
          scale=min(maxdim/w,maxdim/h,1)
          nw,nh=round(w*scale),round(h*scale)
          subject=subject.resize((nw,nh),Image.Resampling.LANCZOS)
          out=Image.new('RGBA',(1024,1024),(0,0,0,0))
          out.alpha_composite(subject,((1024-nw)//2,(1024-nh)//2))
          newbox=out.getchannel('A').getbbox()
          print('Before:',bbox,'After:',newbox,'canvas',out.size,'mode',out.mode)
          if min(newbox[0],newbox[1],1024-newbox[2],1024-newbox[3])<79:
              raise SystemExit('Insufficient transparent padding')
          out.save(path,format='PNG',optimize=True)
          print('PASS: transparent safe margins at least 8%')
          PY
      - name: Commit normalized PNG and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/raw/clatter_reference.png
          git rm .github/workflows/normalize-clatter-margins.yml
          git commit -m "art: centre Captain Clatter with 8 percent transparent safe margin"
          git push

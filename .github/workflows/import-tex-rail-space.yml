name: Import seamless Orbit Drop chrome rail (one-time)
on:
  push:
    branches:
      - art/tex-rail-space
    paths:
      - .github/workflows/import-tex-rail-space.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Import, tile-blend and QA brushed chrome texture
        env:
          IMAGE_URL: https://cdn.creativeclaw.co/u/f3e7a3b1/images/d0740502-1b17-47ea-91fb-8a43212d4d40.png
        run: |
          python -m pip -q install Pillow numpy
          python - <<'PY'
          import os, urllib.request
          from io import BytesIO
          from pathlib import Path
          import numpy as np
          from PIL import Image, ImageStat
          req=urllib.request.Request(os.environ['IMAGE_URL'],headers={'User-Agent':'MarbleRushArtImporter/1.0'})
          with urllib.request.urlopen(req,timeout=60) as resp:
              data=resp.read(30000000)
          if not data.startswith(b'\x89PNG\r\n\x1a\n') or not 15000<len(data)<29000000:
              raise SystemExit('FAIL: unexpected PNG input')
          original=Image.open(BytesIO(data))
          original.load()
          if original.width!=original.height or not (1024<=original.width<=4096):
              raise SystemExit(f'FAIL: image must be a large square texture, got {original.size}')
          # Downsample from source for fine brushed-metal detail and smooth
          # repeat across all track sections. Preserve full-bleed material.
          rgb=original.convert('RGB').resize((1024,1024),Image.Resampling.LANCZOS)
          arr=np.asarray(rgb,dtype=np.float32).copy()
          texture_std=float(np.asarray(rgb,dtype=np.float32).std())
          if texture_std<3.0:
              raise SystemExit('FAIL: texture is visually flat')
          band=64
          # Feather opposite edges against each other to enforce pixel-exact
          # wrapping, while preserving the central chrome grain and panels.
          for x in range(band):
              blend=.5*(1-x/(band-1))
              a=arr[:,x,:].copy()
              b=arr[:,-1-x,:].copy()
              arr[:,x,:]=(1-blend)*a+blend*b
              arr[:,-1-x,:]=(1-blend)*b+blend*a
          for y in range(band):
              blend=.5*(1-y/(band-1))
              a=arr[y,:,:].copy()
              b=arr[-1-y,:,:].copy()
              arr[y,:,:]=(1-blend)*a+blend*b
              arr[-1-y,:,:]=(1-blend)*b+blend*a
          image=Image.fromarray(np.clip(np.rint(arr),0,255).astype('uint8'),'RGB')
          pixels=np.asarray(image,dtype=np.int16)
          lr=int(np.abs(pixels[:,0,:]-pixels[:,-1,:]).max())
          tb=int(np.abs(pixels[0,:,:]-pixels[-1,:,:]).max())
          print('SOURCE SIZE:',original.size,'SOURCE MODE:',original.mode)
          print('TEXTURE STD:',round(texture_std,2))
          print('SEAM MAX DIFF: left/right',lr,'top/bottom',tb)
          if lr>1 or tb>1:raise SystemExit('FAIL: repeat texture edges do not match')
          dst=Path('assets/raw/tex_rail_space.png')
          dst.parent.mkdir(parents=True,exist_ok=True)
          image.save(dst,format='PNG',optimize=True)
          verified=Image.open(dst)
          verified.load()
          if verified.size!=(1024,1024) or verified.mode!='RGB':
              raise SystemExit('FAIL: output must be 1024x1024 RGB PNG')
          print('PASS: Orbit Drop seamless brushed chrome rail texture 1024x1024 opaque RGB')
          print('BYTES:',dst.stat().st_size)
          PY
      - name: Commit art-only texture and remove one-time importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/raw/tex_rail_space.png
          git rm .github/workflows/import-tex-rail-space.yml
          git commit -m "art: add seamless brushed chrome Orbit Drop rail candidate"
          git push

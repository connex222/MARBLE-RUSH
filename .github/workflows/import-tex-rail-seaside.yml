name: Import seamless Seaside Sprint wooden boardwalk rail (one-time)
on:
  push:
    branches:
      - art/tex-rail-seaside
    paths:
      - .github/workflows/import-tex-rail-seaside.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Import, tile-blend and QA sun-bleached boardwalk texture
        env:
          IMAGE_URL: https://cdn.creativeclaw.co/u/f3e7a3b1/images/821746e9-3647-4f10-8105-47ca8afc65e2.png
        run: |
          python -m pip -q install Pillow numpy
          python - <<'PY'
          import os,urllib.request
          from io import BytesIO
          from pathlib import Path
          import numpy as np
          from PIL import Image
          request=urllib.request.Request(os.environ['IMAGE_URL'],headers={'User-Agent':'MarbleRushSeasideTextureImporter/1.0'})
          with urllib.request.urlopen(request,timeout=65) as response:
              data=response.read(32000000)
          if not data.startswith(b'\x89PNG\r\n\x1a\n') or not 15000<len(data)<31000000:
              raise SystemExit('FAIL: invalid source PNG')
          source=Image.open(BytesIO(data));source.load()
          if source.width!=source.height or not 1024<=source.width<=4096:
              raise SystemExit(f'FAIL: source should be a square texture, got {source.size}')
          rgb=source.convert('RGB').resize((1024,1024),Image.Resampling.LANCZOS)
          arr=np.asarray(rgb,dtype=np.float32).copy()
          if float(arr.std())<5:
              raise SystemExit('FAIL: insufficient visual texture')
          band=64
          for x in range(band):
              strength=.5*(1.0-x/(band-1))
              first=arr[:,x,:].copy()
              last=arr[:,-1-x,:].copy()
              arr[:,x,:]=(1-strength)*first+strength*last
              arr[:,-1-x,:]=(1-strength)*last+strength*first
          for y in range(band):
              strength=.5*(1.0-y/(band-1))
              first=arr[y,:,:].copy()
              last=arr[-1-y,:,:].copy()
              arr[y,:,:]=(1-strength)*first+strength*last
              arr[-1-y,:,:]=(1-strength)*last+strength*first
          result=Image.fromarray(np.clip(np.rint(arr),0,255).astype('uint8'),'RGB')
          pix=np.asarray(result,dtype=np.int16)
          lr=int(np.abs(pix[:,0,:]-pix[:,-1,:]).max())
          tb=int(np.abs(pix[0,:,:]-pix[-1,:,:]).max())
          if lr>1 or tb>1:
              raise SystemExit(f'FAIL: seam mismatch {lr} {tb}')
          dest=Path('assets/raw/tex_rail_seaside.png')
          dest.parent.mkdir(parents=True,exist_ok=True)
          result.save(dest,format='PNG',optimize=True)
          check=Image.open(dest);check.load()
          if check.size!=(1024,1024) or check.mode!='RGB':
              raise SystemExit('FAIL: saved texture invalid')
          print('SOURCE:',source.size,source.mode)
          print('SEAM MAX DIFF: left/right',lr,'top/bottom',tb)
          print('PASS: Seaside Sprint full-bleed 1024x1024 seamless opaque RGB boardwalk PNG')
          print('BYTES:',dest.stat().st_size)
          PY
      - name: Commit artwork and remove importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/raw/tex_rail_seaside.png
          git rm .github/workflows/import-tex-rail-seaside.yml
          git commit -m "art: add Seaside Sprint seamless boardwalk rail candidate"
          git push

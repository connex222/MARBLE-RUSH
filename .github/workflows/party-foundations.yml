name: Party Pack foundation QA
on:
  push:
    branches: [dev/party-pack-phase2-foundations, dev/party-pack-phase3-dropzone]
  pull_request:
    paths:
      - 'src/modes/**'
      - 'src/engine.js'
      - 'src/tv.js'
      - 'src/tv.html'
      - 'src/play.html'
      - 'tools/build.js'
      - 'tools/balance-lab.js'
      - 'tools/test-party-foundations.js'
      - '.github/workflows/party-foundations.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check syntax
        run: |
          node --check src/engine.js
          node --check src/tv.js
          node --check server/server.js
          node --check tools/build.js
          node --check tools/balance-lab.js
          node --check tools/test-party-foundations.js
          node --check tools/test-dropzone.js
          node --check tools/test-grandprix-regression.js
          for f in src/modes/*.js; do node --check "$f"; done
      - name: Validate modes and score ledger
        run: npm run test:party
      - name: Validate Drop Zone 30-seed full games
        run: npm run test:dropzone
      - name: Compare Grand Prix deterministic physics to main
        run: |
          git fetch --no-tags --depth=1 origin main
          git show FETCH_HEAD:src/engine.js > /tmp/marble-rush-main-engine.js
          node tools/test-grandprix-regression.js /tmp/marble-rush-main-engine.js
      - name: Compile both standalone browser pages
        run: npm run build
      - name: Verify all modes baked in, zero broken placeholders
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('public/tv.html','utf8');
          for (const name of ['grandprix','derby','dropzone','brawl','curling','golf']) {
            if (!html.includes("id:'"+name+"'") && !html.includes("id: '"+name+"'")) throw Error('Missing mode '+name);
          }
          if(html.includes('/*MODES*/')) throw Error('Uncompiled mode placeholder');
          if(html.length>1.5*1024*1024) throw Error('TV page above 1.5 MB');
          if(!html.includes('partyModeCards')) throw Error('Missing lobby picker');
          if(!html.includes('src="') && !html.includes('<canvas')) throw Error('TV document malformed');
          console.log('PASS: standalone TV '+Math.round(html.length/1024)+' KB');
          NODE
      - name: Package Phase 3 Drop Zone source and evidence for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: marble-rush-phase3-dropzone
          retention-days: 14
          compression-level: 6
          path: |
            src/modes/
            src/engine.js
            src/tv.js
            src/tv.html
            src/play.html
            tools/build.js
            tools/balance-lab.js
            tools/test-party-foundations.js
            tools/test-dropzone.js
            tools/test-grandprix-regression.js
            package.json
            docs/PARTY-PHASE2.md
            docs/PARTY-PHASE3-DROPZONE.md
            MARBLE_RUSH_MASTER.md
            README.md
            .github/workflows/party-foundations.yml

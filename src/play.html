<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14163A">
<title>Marble Rush — Controller</title>
<style>
/*FONTS*/
:root{
  --bg:#14163A; --bg2:#0F1130; --card:#1E2257; --ink:#FFF4E0; --dim:rgba(255,244,224,.68);
  --red:#FF3B5C; --gold:#FFC83D; --sky:#4CC9F0; --mint:#3DDC97; --line:rgba(255,244,224,.16);
  --pc:#FF3B5C;
  --display:'Fredoka','Arial Rounded MT Bold',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{--bg:#FFF6E6; --bg2:#FFE9C7; --card:#ffffff; --ink:#14163A; --dim:rgba(20,22,58,.7); --line:rgba(20,22,58,.18)}
}
body.hc{--bg:#000; --bg2:#000; --card:#000; --ink:#fff; --dim:#fff; --line:#fff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background-image:linear-gradient(rgba(15,17,48,.84),rgba(15,17,48,.9)),url('assets/img/bg_phone.webp');
  background-size:cover;background-position:center;background-repeat:no-repeat}
@media (prefers-color-scheme: light){body:not(.hc){background-image:linear-gradient(rgba(255,246,230,.88),rgba(255,246,230,.94)),url('assets/img/bg_phone.webp')}}
body.hc{background-image:none}
[hidden]{display:none!important}
button{font-family:var(--display);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- join ---------- */
#join{flex:1;display:flex;flex-direction:column;padding:22px 20px 18px;gap:14px;overflow:auto}
.logo{font-family:var(--display);font-weight:700;line-height:.86;transform:skewX(-8deg);margin:6px 0 4px}
.logo span{display:block;font-size:54px;color:var(--red);-webkit-text-stroke:2px var(--gold);paint-order:stroke fill;text-shadow:0 4px 0 #8f1029}
.logo span+span{color:#FFF4E0;-webkit-text-stroke-color:var(--red)}
.logo.asset-logo{transform:none;margin:6px auto 4px;width:100%;max-width:330px}
.logo.asset-logo span{display:none}
.logo.asset-logo img{display:block;width:100%;height:auto;max-height:130px;object-fit:contain;filter:drop-shadow(0 7px 12px rgba(0,0,0,.32))}
label{font-weight:800;font-size:16px;color:var(--dim)}
input{width:100%;font-family:var(--display);font-weight:600;font-size:30px;color:var(--ink);background:var(--card);border:3px solid var(--line);
  border-radius:18px;padding:12px 16px;margin-top:6px}
#inCode{letter-spacing:.3em;text-transform:uppercase;font-size:40px;text-align:center}
#swirls{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 10px;margin-top:4px;scrollbar-width:none}
.sw{flex:none;width:54px;height:54px;border-radius:50%;border:0;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 8%,transparent 20%),conic-gradient(from 20deg,var(--a),var(--b),var(--c),var(--a),var(--b),var(--a));
  box-shadow:inset -5px -7px 12px rgba(10,10,40,.5)}
.sw[aria-pressed="true"]{box-shadow:inset -5px -7px 12px rgba(10,10,40,.5),0 0 0 4px var(--gold);transform:scale(1.08)}
.big{width:100%;font-weight:600;font-size:32px;color:#fff;border:0;border-radius:22px;padding:18px;
  background:linear-gradient(180deg,#ff5a77,#e02447);box-shadow:0 7px 0 #8f1029}
.big:active{transform:translateY(4px);box-shadow:0 3px 0 #8f1029}
.big:disabled{opacity:.45}
.err{min-height:22px;font-weight:800;color:#ff8a75;font-size:17px}

/* ---------- controller ---------- */
#ctl{flex:1;display:flex;flex-direction:column;min-height:0}
#top{padding:14px 18px 6px;display:flex;align-items:center;gap:12px}
#me{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
#meMarble{flex:none;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 8%,transparent 20%),conic-gradient(from 20deg,var(--a,#fff),var(--b,#f00),var(--c,#fff),var(--a,#fff),var(--b,#f00),var(--a,#fff));
  box-shadow:inset -4px -6px 10px rgba(10,10,40,.5),0 0 0 3px var(--pc)}
#meName{font-family:var(--display);font-weight:600;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vipBadge{font-size:20px}
#hostExitGame{flex:none;min-height:47px;padding:5px 12px;border:3px solid #ffe6b6;border-radius:14px;background:linear-gradient(#ff596e,#b50f37);color:#fff;box-shadow:0 5px 0 #6e1230;font:800 16px Fredoka,sans-serif;white-space:nowrap}
#hostExitGame:active{transform:translateY(3px)}
#hcBtn{flex:none;height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);font-family:var(--body);font-weight:800;font-size:15px}

#look{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px}
#place{font-family:var(--display);font-weight:700;font-size:96px;line-height:.9;color:var(--pc);-webkit-text-stroke:3px var(--bg2);paint-order:stroke fill}
#place small{font-size:36px;color:var(--dim);-webkit-text-stroke:0}
#msg{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.15;margin-top:6px}
#sub{font-size:18px;color:var(--dim);margin-top:6px;font-weight:700}
#prog{width:82%;height:12px;background:var(--line);border-radius:99px;margin-top:14px;overflow:hidden}
#progFill{height:100%;width:0;background:var(--pc);border-radius:99px;transition:width .2s linear}

#vip{display:flex;gap:10px;padding:0 18px 10px;flex-wrap:wrap;justify-content:center}
#vip button{flex:1 1 40%;font-weight:600;font-size:22px;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px 10px}
#vip button.primary{color:#fff;background:linear-gradient(180deg,#ff5a77,#e02447);border-color:#ffd0d8;box-shadow:0 5px 0 #8f1029}

#modePanel{padding:6px 18px 12px;text-align:center;max-height:210px;overflow:auto}
#modeTurn{font:800 19px Fredoka,sans-serif;color:var(--gold)}
#modeReadout{font:700 16px Nunito,sans-serif;color:var(--ink);margin:4px}
#modeActions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
#modeActions button{font:800 16px Nunito,sans-serif;color:var(--ink);background:var(--card);
 border:2px solid var(--line);border-radius:12px;padding:8px 13px;min-width:80px}
#modeActions button[aria-pressed="true"]{border-color:var(--gold)}
/* Phase 2 controller: thumb-sized targets even with expanded controls. */
#modeActions button{min-height:48px;min-width:112px;font-size:17px;padding:11px 14px;
  box-shadow:0 4px 0 rgba(0,0,0,.25)}
#modeActions button:active{transform:translateY(2px)}
@media(max-width:380px){#modeActions button{min-width:98px;font-size:16px}}
#cheer{align-self:center;margin:6px 0 8px;border:2px solid var(--gold);background:var(--card);border-radius:14px;
 font:800 16px Nunito,sans-serif;color:var(--ink);padding:8px 20px}
#votes{display:flex;flex-direction:column;gap:10px;padding:0 18px 12px}
#votes button{display:flex;align-items:center;gap:12px;font-weight:600;font-size:24px;color:#fff;border:3px solid transparent;border-radius:20px;padding:14px 16px;
  background:var(--vc);box-shadow:0 5px 0 rgba(0,0,0,.3);text-align:left;text-shadow:0 2px 0 rgba(0,0,0,.3)}
#votes button span{font-size:30px}
#votes button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,200,61,.4),0 5px 0 rgba(0,0,0,.3)}
#votes button.lost{opacity:.35}
body[data-s="vote"] #padZone{flex-basis:30%}
/* the pad: bottom 60% (Section 7.1) */
#padZone{position:relative;flex:0 0 60%;min-height:0;transition:flex-basis .3s;display:flex;align-items:center;justify-content:center;padding:20px 18px 30px}
body:not([data-s="race"]):not([data-s="countdown"]) #padZone{flex-basis:44%}
#pad{position:relative;height:min(100%,80vw);width:auto;aspect-ratio:1/1;aspect-ratio:1;border-radius:50%;border:0;touch-action:none;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--pc) 55%,#fff) 0%,var(--pc) 45%,color-mix(in srgb,var(--pc) 60%,#000) 100%);
  box-shadow:0 14px 0 color-mix(in srgb,var(--pc) 45%,#000),0 24px 40px rgba(0,0,0,.4),inset 0 -14px 30px rgba(0,0,0,.25);
  transition:transform .08s, box-shadow .08s, filter .2s}
#pad.down{transform:translateY(8px) scale(.97);box-shadow:0 6px 0 color-mix(in srgb,var(--pc) 45%,#000),0 12px 24px rgba(0,0,0,.4),inset 0 -8px 20px rgba(0,0,0,.25)}
#pad.grip{filter:saturate(1.3) brightness(1.08)}
#pad.grip::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:6px solid var(--mint);animation:gripPulse .5s ease-in-out infinite alternate}
@keyframes gripPulse{to{inset:-20px;opacity:.5}}
#pad.empty{filter:grayscale(.85) brightness(.8)}
#pad.super{filter:saturate(1.25) brightness(1.1)}
#pad.super #ringFg{stroke:#fff;stroke-width:7;filter:drop-shadow(0 0 6px var(--gold))}
#pad.super::before{content:"";position:absolute;inset:-12px;border-radius:50%;box-shadow:0 0 0 5px var(--gold),0 0 34px 8px var(--gold);animation:gripPulse .45s ease-in-out infinite alternate;pointer-events:none}
#pad.burst{animation:burst .35s ease-out}
@keyframes burst{0%{transform:scale(1.06)}100%{transform:scale(1)}}
#ring{position:absolute;inset:-12px;pointer-events:none;transform:rotate(-90deg)}
#ring circle{fill:none;stroke-width:4;stroke-linecap:round}
#ringBg{stroke:var(--line)} #ringFg{stroke:var(--gold);transition:stroke-dashoffset .12s linear}
#padText{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;color:#fff;
  font-family:var(--display);text-shadow:0 3px 0 rgba(0,0,0,.25)}
#padText b{font-weight:700;font-size:min(13vw,8vh);line-height:1}
#padText span{font-weight:600;font-size:min(5.4vw,3.2vh);opacity:.95;margin-top:6px}
#item{position:absolute;right:16px;top:-6px;width:88px;height:88px;border-radius:50%;border:4px solid var(--gold);background:var(--card);
  font-size:42px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.35);touch-action:none;color:var(--ink)}
#item img{width:72px;height:72px;object-fit:contain;pointer-events:none}
#item:disabled{display:none}
#item.ready{animation:itemPulse .9s ease-in-out infinite}
@keyframes itemPulse{50%{transform:scale(1.08)}}
#banner{position:fixed;left:0;right:0;top:0;padding:10px;text-align:center;font-weight:800;background:#e02447;color:#fff;font-size:17px;z-index:9}
#flash{position:fixed;inset:0;pointer-events:none;background:var(--pc);opacity:0}
#flash.on{animation:fl .4s ease-out}
@keyframes fl{0%{opacity:.35}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* DERBY UI V2 — exclusively themed phone view, no change to phone actions.
   Grand Prix and the other four mode skins retain their previous styling. */
body[data-mode="derby"][data-s="derby"]:not(.hc){
 --bg:#0b1830;--bg2:#101a32;--card:#162440;--ink:#fff2d7;
 --dim:#e8d4ac;--line:#eac47e7f;--gold:#ffd887;
 background-image:linear-gradient(180deg,rgba(7,17,34,.89),rgba(10,16,37,.94) 50%,rgba(7,12,28,.98)),
 url('assets/img/pp_derby_bg.webp');
 background-position:center;background-size:cover;
}
body[data-mode="derby"][data-s="derby"] #top{
 background:linear-gradient(120deg,#111b38f1,#3c2b3ded);
 border-bottom:2px solid #ffe0a388;box-shadow:0 8px 25px #0007;
 padding:10px 12px 11px;gap:8px
}
body[data-mode="derby"][data-s="derby"] #me{gap:7px}
body[data-mode="derby"][data-s="derby"] #meName{
 font-size:18px;max-width:140px;color:#fff3d6;text-shadow:0 2px 3px #000b
}
body[data-mode="derby"][data-s="derby"] #meMarble{height:39px;width:39px}
body[data-mode="derby"][data-s="derby"] #hcBtn{
 height:36px;font-size:12px;padding:0 9px;color:var(--ink);
 border:2px solid #ffe0aa7c;background:#182544bb
}
body[data-mode="derby"][data-s="derby"] #hostExitGame{
 font-size:14px;min-height:38px;padding:5px 9px;border-radius:12px;
 border:2px solid #ffe6b6
}
body[data-mode="derby"][data-s="derby"] #look{
 flex:0 0 auto;min-height:0;margin:14px 14px 7px;padding:11px 12px;
 background:linear-gradient(140deg,#101d3de9,#34263aef);
 border:2px solid #ffdfa4ba;border-radius:18px;
 box-shadow:0 9px 24px #0008
}
body[data-mode="derby"][data-s="derby"] #msg{
 margin:0;font:900 clamp(23px,7vw,31px) Fredoka,sans-serif;color:#ffe4a3;
 text-shadow:0 3px 5px #000b
}
body[data-mode="derby"][data-s="derby"] #sub{
 margin-top:6px;font:800 15px Nunito,sans-serif;color:#eee6dc;line-height:1.35
}
body[data-mode="derby"][data-s="derby"] #vip{padding:0 14px;gap:6px}
body[data-mode="derby"][data-s="derby"] #vip button{
 font-size:14px;padding:7px 9px;border-radius:11px
}
body[data-mode="derby"][data-s="derby"] #modePanel{
 flex:0 1 auto;margin:7px 13px 2px;padding:13px 12px 14px;max-height:min(45vh,390px);
 border:2px solid #ffe0a8b5;border-radius:20px;
 background:linear-gradient(155deg,#172744ef,#34273eeb);
 box-shadow:0 12px 30px #000a;overflow-y:auto;overscroll-behavior:contain;
}
body[data-mode="derby"][data-s="derby"] #modeTurn{
 font:900 19px Fredoka,sans-serif;color:#ffe09e;
 letter-spacing:.03em;padding-bottom:5px
}
body[data-mode="derby"][data-s="derby"] #modeReadout{
 font:800 15px Nunito,sans-serif;color:#fff4da;margin-bottom:10px
}
body[data-mode="derby"][data-s="derby"] #modeActions{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px
}
body[data-mode="derby"][data-s="derby"] #modeActions button{
 min-width:0;min-height:52px;margin:0;padding:8px 5px;
 border-radius:13px;border:2px solid #ffddb08f;
 font:800 14px Nunito,sans-serif;color:#fff6df;
 background:linear-gradient(160deg,#364665,#16203f);
 box-shadow:0 4px 0 #0a132a;white-space:normal
}
body[data-mode="derby"][data-s="derby"] #modeActions button[data-action="bet"]{
 background:linear-gradient(155deg,#855137,#492b3d);
 border-color:#f4c480
}
body[data-mode="derby"][data-s="derby"] #modeActions button[data-action="stake"]{
 background:linear-gradient(155deg,#25465b,#132a42)
}
body[data-mode="derby"][data-s="derby"] #modeActions button[data-action="cheer"]{
 grid-column:span 2;background:linear-gradient(140deg,#188e86,#146175);border-color:#a9f5dc
}
body[data-mode="derby"][data-s="derby"] #modeActions button[aria-pressed="true"]{
 border-color:#fff5c8;box-shadow:0 0 0 2px #ffd16a8c,0 4px 0 #0a132a
}
body[data-mode="derby"][data-s="derby"] #padZone{
 flex:1 1 auto;min-height:160px;padding:13px 14px 25px
}
body[data-mode="derby"][data-s="derby"][data-derby-phase="betting"] #padZone{
 display:none!important
}
body[data-mode="derby"][data-s="derby"] #pad{
 width:auto;height:min(100%,min(67vw,255px));max-height:270px;
 background:radial-gradient(circle at 33% 21%,#fff9e2 0%,#ffd879 17%,#e99547 40%,#c65350 75%,#702641 100%);
 border:7px solid #ffe1a1;outline:5px solid #95643f;
 box-shadow:0 10px 0 #7d423b,0 18px 35px #0009,inset 0 8px 14px #fff6df95,
 inset 0 -18px 28px #4c253eab
}
body[data-mode="derby"][data-s="derby"] #padText{
 color:#251b30;text-shadow:0 1px 0 #ffe5af
}
body[data-mode="derby"][data-s="derby"] #padText b{font-size:min(13vw,56px)}
body[data-mode="derby"][data-s="derby"] #padText span{
 font-size:min(4.5vw,17px);font-weight:900;max-width:190px
}
body[data-mode="derby"][data-s="derby"] #pad:disabled{
 opacity:.46;filter:grayscale(.6);cursor:default
}
body[data-mode="derby"][data-s="derby"] #ring{inset:-13px}
body[data-mode="derby"][data-s="derby"] #ringFg{stroke:#fff1b9}
body[data-mode="derby"][data-s="derby"] #ringBg{stroke:#ffdf8e6e}
@media(max-height:670px){
 body[data-mode="derby"][data-s="derby"] #look{margin:5px 12px;padding:7px 10px}
 body[data-mode="derby"][data-s="derby"] #modePanel{max-height:40vh}
 body[data-mode="derby"][data-s="derby"] #padZone{min-height:105px}
}


/* DROP ZONE v2 — phone is the chute controller and spectator prize predictor.
   Existing WebSocket action names and player identity remain untouched. */
body[data-mode="dropzone"][data-s="dropzone"]:not(.hc){
 --bg:#081d30;--bg2:#0b2941;--card:#103e55;--ink:#fff3ce;
 --dim:#c8ebde;--line:#62d4c27d;--gold:#ffd67c;
 background-image:linear-gradient(170deg,rgba(6,25,40,.91),rgba(5,27,42,.90) 47%,rgba(5,16,38,.97)),
 url('assets/img/pp_dropzone_bg.webp');
 background-position:center;background-size:cover
}
body[data-mode="dropzone"][data-s="dropzone"] #top{
 background:linear-gradient(130deg,#0b3650fa,#12263df1);
 padding:10px 11px;border-bottom:2px solid #ffdb8d9e;
 box-shadow:0 7px 24px #000a;gap:7px
}
body[data-mode="dropzone"][data-s="dropzone"] #meName{
 font:900 18px Fredoka,sans-serif;color:#fff4d4;max-width:140px
}
body[data-mode="dropzone"][data-s="dropzone"] #meMarble{height:38px;width:38px}
body[data-mode="dropzone"][data-s="dropzone"] #hostExitGame{
 min-height:38px;padding:4px 8px;font-size:13px;border:2px solid #ffe5af
}
body[data-mode="dropzone"][data-s="dropzone"] #hcBtn{
 height:37px;font-size:12px;padding:3px 8px;color:#fff4d4;border-color:#70d4c0
}
body[data-mode="dropzone"][data-s="dropzone"] #look{
 flex:0 0 auto;margin:14px 13px 7px;padding:17px 11px;
 background:linear-gradient(135deg,#0e4a5feb,#142a45f0);
 border:2px solid #ffe2a7;border-radius:21px;box-shadow:0 12px 26px #0009
}
body[data-mode="dropzone"][data-s="dropzone"] #msg{
 margin:0;font:900 clamp(23px,6.9vw,31px) Fredoka,sans-serif;
 color:#ffe2a0;line-height:1.1;text-shadow:0 3px 5px #0009
}
body[data-mode="dropzone"][data-s="dropzone"] #sub{
 color:#d8faf0;font:800 15px Nunito,sans-serif;line-height:1.35;margin-top:7px
}
body[data-mode="dropzone"][data-s="dropzone"] #vip{gap:7px;padding:0 12px}
body[data-mode="dropzone"][data-s="dropzone"] #vip button{
 font-size:14px;padding:7px 9px;border-radius:11px
}
body[data-mode="dropzone"][data-s="dropzone"] #modePanel{
 flex:0 1 auto;max-height:min(48vh,410px);overflow-y:auto;overscroll-behavior:contain;
 padding:13px;margin:7px 13px 3px;
 background:linear-gradient(160deg,#0b3b51f1,#152942f1);
 border:2px solid #ffe2a7;border-radius:20px;box-shadow:0 10px 26px #0009
}
body[data-mode="dropzone"][data-s="dropzone"] #modeTurn{
 font:900 19px Fredoka,sans-serif;color:#ffe49e
}
body[data-mode="dropzone"][data-s="dropzone"] #modeReadout{
 font:800 15px Nunito,sans-serif;color:#d8f9eb;margin:7px 0 12px
}
body[data-mode="dropzone"][data-s="dropzone"] #modeActions{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px
}
body[data-mode="dropzone"][data-s="dropzone"] #modeActions button{
 min-width:0;min-height:58px;padding:9px 5px;font:900 16px Nunito,sans-serif;
 color:#fff5db;border-radius:14px;border:2px solid #90e6d5;
 background:linear-gradient(165deg,#286d7b,#0e3953);
 box-shadow:0 5px 0 #082438
}
body[data-mode="dropzone"][data-s="dropzone"] #modeActions button[data-action="drop"]{
 grid-column:span 2;background:linear-gradient(165deg,#ffedb2,#eda94d 70%,#c47746);
 color:#282334;font:900 27px Fredoka,sans-serif;border-color:#fff5d6;
 min-height:78px;box-shadow:0 6px 0 #9b5634
}
body[data-mode="dropzone"][data-s="dropzone"][data-drop-phase="falling"] #modeActions{
 grid-template-columns:repeat(4,minmax(0,1fr));gap:7px
}
body[data-mode="dropzone"][data-s="dropzone"][data-drop-phase="falling"] #modeActions button[data-action="predict"]{
 min-height:56px;padding:8px 2px;font-size:15px;border-color:#ffdd8b;
 background:linear-gradient(150deg,#805d4a,#26465c)
}
body[data-mode="dropzone"][data-s="dropzone"] #modeActions button:focus-visible{
 outline:3px solid #fff7db;outline-offset:3px
}
body[data-mode="dropzone"][data-s="dropzone"] #modeActions button[aria-pressed="true"]{
 border-color:#fff9bc;box-shadow:0 0 0 3px #ffd98a8c,0 4px 0 #082438
}
body[data-mode="dropzone"][data-s="dropzone"] #padZone{
 flex:1 1 auto;min-height:140px;padding:12px 16px 29px
}
body[data-mode="dropzone"][data-s="dropzone"]:not([data-drop-phase="aim"]) #padZone,
body[data-mode="dropzone"][data-s="dropzone"][data-drop-turn="false"] #padZone{
 display:none!important
}
body[data-mode="dropzone"][data-s="dropzone"] #pad{
 height:min(100%,min(63vw,235px));max-height:255px;
 width:auto;border:8px solid #ffe29d;
 background:radial-gradient(circle at 30% 24%,#fff5ca 0%,#fcd573 18%,#b9814e 43%,#3b8c96 76%,#165269 100%);
 box-shadow:0 11px 0 #705a3d,0 23px 36px #0009,inset 0 10px 16px #fffae4a1;
}
body[data-mode="dropzone"][data-s="dropzone"] #padText{
 color:#152f42;text-shadow:0 1px 0 #fff3c7
}
body[data-mode="dropzone"][data-s="dropzone"] #padText b{
 font:900 min(13vw,54px) Fredoka,sans-serif
}
body[data-mode="dropzone"][data-s="dropzone"] #padText span{
 font:900 min(4.4vw,16px) Nunito,sans-serif
}
body[data-mode="dropzone"][data-s="dropzone"] #ringFg{stroke:#fff6cf}
body[data-mode="dropzone"][data-s="dropzone"] #ringBg{stroke:#c8f9ed81}
@media(max-height:680px){
 body[data-mode="dropzone"][data-s="dropzone"] #look{margin:5px 10px;padding:9px}
 body[data-mode="dropzone"][data-s="dropzone"] #modePanel{max-height:42vh}
 body[data-mode="dropzone"][data-s="dropzone"] #padZone{min-height:100px}
}

</style>
</head>
<body>
<div id="banner" hidden>Reconnecting…</div>

<section id="join">
  <div class="logo"><span>MARBLE</span><span>RUSH</span></div>
  <div><label for="inCode">Room code (on the TV)</label><input id="inCode" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text"></div>
  <div><label for="inName">Your name</label><input id="inName" maxlength="10" autocomplete="nickname" spellcheck="false"></div>
  <div><label>Pick your marble</label><div id="swirls"></div></div>
  <div class="err" id="joinErr" role="alert"></div>
  <button class="big" id="btnJoin">Join the race</button>
</section>

<section id="ctl" hidden>
  <div id="top">
    <div id="me"><div id="meMarble"></div><div id="meName"></div><span id="vipBadge" hidden>👑</span></div>
    <button id="hostExitGame" type="button" aria-label="Return all players to the lobby" hidden>⌂ LOBBY</button>
    <button id="hcBtn" aria-label="Toggle high contrast">Contrast</button>
  </div>
  <div id="look">
    <div id="place" hidden></div>
    <div id="msg">You're in!</div>
    <div id="sub"></div>
    <div id="prog" hidden><div id="progFill"></div></div>
  </div>
  <div id="votes" hidden></div>
  <div id="vip" hidden></div>
  <section id="modePanel" hidden aria-label="Current game controls">
    <div id="modeTurn"></div>
    <div id="modeReadout"></div>
    <div id="modeActions"></div>
  </section>
  <button id="cheer" type="button" hidden>CHEER!</button>
  <div id="padZone">
    <button id="pad" aria-label="Tap to boost, hold to grip">
      <svg id="ring" viewBox="0 0 100 100"><circle id="ringBg" cx="50" cy="50" r="46"/><circle id="ringFg" cx="50" cy="50" r="46"/></svg>
      <div id="padText"><b>TAP</b><span>boost · hold to grip</span></div>
    </button>
    <button id="item" disabled aria-label="Use item"></button>
  </div>
</section>
<div id="flash"></div>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const SWIRLS = [
    ['#f4eefc','#FF3B5C','#ffffff'],['#0b3d91','#ffffff','#4CC9F0'],['#e9a100','#ffe08a','#fff4c2'],
    ['#d9fbe9','#3DDC97','#FFF4E0'],['#2a145e','#8B5CF6','#ffffff'],['#ffd0e6','#FF5FA2','#ffffff'],
    ['#ff8a3d','#ffd23f','#ff3b5c'],['#30366e','#4CC9F0','#FF5FA2'],['#d8f1ff','#4CC9F0','#ffffff'],
    ['#ffd23f','#ff8a3d','#fff4c2'],['#e6f4ff','#8fd0ff','#ffffff'],['#16161f','#FFC83D','#7b6630'],
  ];
  const ITEM_ICON = { turbo:'🌪️', jelly:'🟢', oil:'🛢️', big:'⚫', bubble:'🫧' };
  const ITEM_NAME = { turbo:'Turbo Tornado', jelly:'Sticky Jelly', oil:'Oil Slick', big:'Big Bertha', bubble:'Bubble Shield' };
  const ORD = n => n + (n % 10 === 1 && n % 100 !== 11 ? 'st' : n % 10 === 2 && n % 100 !== 12 ? 'nd' : n % 10 === 3 && n % 100 !== 13 ? 'rd' : 'th');
  const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

  let pid = store.get('mr_pid');
  if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 10); store.set('mr_pid', pid); }
  let swirl = +(store.get('mr_swirl') || Math.floor(Math.random() * 12));
  const params = new URLSearchParams(location.search);
  $('#inCode').value = (params.get('room') || store.get('mr_room') || '').toUpperCase();
  $('#inName').value = store.get('mr_name') || '';
  if (store.get('mr_hc') === '1') document.body.classList.add('hc');
  // Replace the text logo only when the approved artwork loads correctly.
  const logoEl = document.querySelector('#join .logo');
  if (logoEl) {
    const art = new Image();
    art.onload = () => { art.alt = 'Marble Rush'; logoEl.appendChild(art); logoEl.classList.add('asset-logo'); };
    art.src = 'assets/img/logo_marblerush.webp';
  }

  // swirl picker
  SWIRLS.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'sw'; b.setAttribute('aria-label', 'Marble ' + (i + 1));
    b.style.cssText = `--a:${p[0]};--b:${p[1]};--c:${p[2]}`;
    b.style.backgroundImage = `radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 8%,transparent 20%),url('assets/img/marble_swirl_${String(i + 1).padStart(2, '0')}.webp'),conic-gradient(var(--a),var(--b),var(--c))`;
    b.style.backgroundSize = 'cover';
    b.onclick = () => { swirl = i; store.set('mr_swirl', i); markSwirl(); if (joined) send({ t:'act', a:'swirl', v:i }); };
    $('#swirls').appendChild(b);
  });
  function markSwirl() { [...$('#swirls').children].forEach((b, i) => b.setAttribute('aria-pressed', String(i === swirl))); }
  markSwirl();

  /* ---------- tiny synth for instant feedback ---------- */
  let ac = null;
  function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (ac && ac.state === 'suspended') ac.resume(); }
  function tone(f, d, type, v, f2) {
    if (!ac) return;
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
  }
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };

  /* ---------- network ---------- */
  let ws = null, open = false, joined = false, retry = 0, hud = null;
  function connect() {
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
    ws.onopen = () => { open = true; retry = 0; $('#banner').hidden = true; if (joined) doJoin(true); };
    ws.onclose = () => { open = false; if (joined) $('#banner').hidden = false; setTimeout(connect, Math.min(6000, 600 * ++retry)); };
    ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch(x){ return; } onMsg(m); };
  }
  function send(m) { if (open) ws.send(JSON.stringify(m)); }
  connect();

  function doJoin(silent) {
    const code = $('#inCode').value.trim().toUpperCase();
    const name = $('#inName').value.trim() || 'Racer';
    if (code.length !== 4) { $('#joinErr').textContent = 'Enter the 4-letter code from the TV.'; return; }
    store.set('mr_room', code); store.set('mr_name', name);
    if (!open) { $('#joinErr').textContent = 'Still connecting — try again in a moment.'; return; }
    send({ t:'join', code, pid, name, swirl });
    if (!silent) $('#btnJoin').disabled = true;
  }
  $('#btnJoin').onclick = () => { audio(); doJoin(false); };
  $('#inCode').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, ''); });

  function onMsg(m) {
    if (m.t === 'err') {
      $('#btnJoin').disabled = false;
      $('#joinErr').textContent = m.e === 'noroom' ? 'No race with that code. Check the code on the TV.' : 'Could not join.';
      if (joined) { joined = false; $('#ctl').hidden = true; $('#join').hidden = false; }
      return;
    }
    if (m.t === 'full') { $('#btnJoin').disabled = false; $('#joinErr').textContent = 'This race is full (8 racers). Wait for the next one.'; return; }
    if (m.t === 'wait') { showCtl(); setText('', 'Waiting for the TV…', 'Keep this page open.'); return; }
    if (m.t === 'hud') { showCtl(); hud = m; render(); }
  }
  function showCtl() {
    if (joined) return;
    joined = true;
    $('#join').hidden = true; $('#ctl').hidden = false; $('#btnJoin').disabled = false;
    try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch(e){}
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && joined) { try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch(e){} }
  });

  /* ---------- render HUD ---------- */
  const RING = 2 * Math.PI * 46;
  $('#ringFg').style.strokeDasharray = RING;
  function setText(place, msg, sub) {
    $('#place').hidden = !place; if (place) $('#place').innerHTML = place;
    $('#msg').textContent = msg; $('#sub').textContent = sub || '';
  }
  function vipButtons(list) {
    const box = $('#vip');
    const key = list.map(b => b[0] + ':' + String(b[3] ?? '') + ':' + b[1]).join('|');
    if (box.dataset.key === key) return;
    box.dataset.key = key; box.innerHTML = '';
    for (const [a, label, primary, value] of list) {
      const b = document.createElement('button'); b.textContent = label; if (primary) b.className = 'primary';
      b.onclick = () => { audio(); tone(900, 0.05, 'sine', 0.15); send({ t:'act', a, ...(value == null ? {} : { v: value }) }); };
      box.appendChild(b);
    }
    box.hidden = !list.length;
  }
  // Shared phone panels are driven by validated HUD descriptors from the TV.
  // Grand Prix is unchanged. Future modes provide their own button actions.
  $('#cheer').onclick=()=>{
    audio();buzz(30);send({t:'act',a:'cheer'});
  };
  $('#hostExitGame').onclick=()=>{audio();buzz(25);send({t:'act',a:'lobby'});};
  function renderModePanel(h) {
    const panel=$('#modePanel');
    if(!h.mode || h.mode==='grandprix' || !['race','countdown','results','lobby','dropzone','brawl','derby','curling','golf'].includes(h.s)){
      panel.hidden=true;return;
    }
    panel.hidden=false;
    $('#modeTurn').textContent=String(h.turnLabel||'').slice(0,70);
    const pts=Number.isFinite(h.roundScore)?Math.round(h.roundScore):null;
    const power=Number.isFinite(h.power)?Math.max(0,Math.min(100,Math.round(h.power))):null;
    const aim=Number.isFinite(h.aim)?Math.round(h.aim):null;
    $('#modeReadout').textContent=[pts===null?'':(h.mode==='derby'?pts+' ◆ virtual gems':pts+' pts'),power===null?'':'Power '+power+'%',Number.isFinite(h.energy)?'Energy '+Math.round(h.energy)+'%':'',aim===null?'':'Aim '+aim+(h.mode==='dropzone'?' px':'°')].filter(Boolean).join(' · ');
    const cheer=$('#cheer');
    cheer.hidden=!(h.s==='race' && (!h.inRace || h.fin));
    cheer.disabled=!h.cheerReady;
    const controls=Array.isArray(h.modeControls)?h.modeControls.slice(0,12):[];
    const key=JSON.stringify(controls);
    const box=$('#modeActions');
    if(box.dataset.key!==key){
      box.dataset.key=key;box.replaceChildren();
      for(const control of controls){
        if(!control || typeof control.a!=='string' || !/^[a-z]{1,16}$/.test(control.a))continue;
        const button=document.createElement('button');
        button.type='button';
        button.textContent=String(control.label||control.a).slice(0,30);
        button.setAttribute('aria-pressed',String(!!control.selected));
        button.dataset.action=control.a; // Mode-specific appearance; action messages unchanged
        button.onclick=()=>{audio();buzz(14);send({t:'act',a:control.a,v:control.v});};
        box.appendChild(button);
      }
    }
  }
  function render() {
    let h = hud;
    document.documentElement.style.setProperty('--pc', h.color);
    const pal = SWIRLS[h.swirl % 12];
    const mini = $('#meMarble');
    mini.style.cssText = `--a:${pal[0]};--b:${pal[1]};--c:${pal[2]}`;
    mini.style.backgroundImage = `radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 8%,transparent 20%),url('assets/img/marble_swirl_${String(h.swirl % 12 + 1).padStart(2, '0')}.webp'),conic-gradient(var(--a),var(--b),var(--c))`;
    mini.style.backgroundSize = 'cover';
    $('#meName').textContent = h.name;
    $('#vipBadge').hidden = !h.vip;
    // Persistent visible host action, independent of each mode's temporary panel.
    $('#hostExitGame').hidden = !(h.vip && !['lobby','boot'].includes(h.s));
    $('#ringFg').style.strokeDashoffset = RING * (1 - h.boost / 100);
    $('#pad').classList.toggle('empty', h.boost < 25 && (h.s === 'race'));
    $('#pad').classList.toggle('super', h.boost >= 100 && (h.s === 'race'));
    document.body.dataset.s = h.s;
    document.body.dataset.mode = h.mode || 'grandprix';
    if(h.mode==='dropzone'&&h.s==='dropzone'){
      document.body.dataset.dropPhase=h.modePhase||'';
      document.body.dataset.dropTurn=String(!!h.isTurn);
    }else{
      delete document.body.dataset.dropPhase;
      delete document.body.dataset.dropTurn;
    }
    if(h.mode==='derby'&&h.s==='derby'){
      document.body.dataset.derbyPhase=h.modePhase||'';
      $('#pad').disabled=!(h.modePhase==='racing'&&h.myBet&&h.isTurn);
    }else{
      delete document.body.dataset.derbyPhase;
      $('#pad').disabled=false;
    }
    const it = $('#item');
    if (h.s !== 'race') h = Object.assign({}, h, { item: null });
    it.disabled = !h.item;
    const iconKey = h.item ? 'item_' + h.item : '';
    if ((it.dataset.iconKey || '') !== iconKey) {
      it.dataset.iconKey = iconKey;
      if (iconKey) {
        const im = document.createElement('img');
        im.alt = '';
        im.src = 'assets/img/' + iconKey + '.webp';
        im.onerror = () => { if (it.dataset.iconKey === iconKey) it.textContent = ITEM_ICON[h.item] || '★'; };
        it.replaceChildren(im);
      } else it.textContent = '';
    }
    it.classList.toggle('ready', !!h.item);
    it.setAttribute('aria-label', h.item ? 'Use ' + ITEM_NAME[h.item] : 'No item');
    $('#prog').hidden = h.s !== 'race';
    $('#progFill').style.width = (h.prog * 100) + '%';
    let vip = [];
    renderVotes(h);
    switch (h.s) {
      case 'lobby':
        setText('', "You're in!", h.vip ? 'You are the host. Start when everyone has joined.' : 'Practise in the bowl while everyone joins.');
        if (h.vip) {
          vip = [['cpu', 'Add CPU racer'], ['start', h.partyLength ? 'Start Party Night' : 'Start race', true]];
          for (const n of [0,3,5,7])
            vip.push(['party', (h.partyLength === n ? '✓ ' : '') + (n ? n + '-game Party Night' : 'Party Night off'), false, n]);
          // Only ready modes are shown; the host's choice is relayed to TV.
          for (const mode of (h.availableModes || [])) vip.push(['mode', (mode.id === h.mode ? '✓ ' : '') + mode.name, false, mode.id]);
        }
        // Selection stays on the TV until the additional mode implementations pass QA.
        break;
      case 'countdown':
        setText(h.cd ? `<span>${h.cd}</span>` : '', h.inRace ? 'Tap right on ROLL!' : 'You join the next race', h.inRace ? 'for a perfect start' : '');
        if(h.vip)vip=[['lobby','Back to Lobby']];
        break;
      case 'golf':
        setText('', h.modePhase==='aim'&&h.isTurn?'YOUR SHOT':h.modePhase==='rolling'?'MARBLE IN MOTION':h.modePhase==='results'?'HOLE RESULTS':'MARBLE GOLF',
          'Hole '+(h.hole||1)+'/5 · '+(h.roundScore||0)+' strokes · '+(h.modeHint||''));
        if(h.vip)vip=[['lobby','End game & lobby']];
        break;
      case 'curling':
        setText('',h.modePhase==='aim'&&h.isTurn?'YOUR THROW':h.modePhase==='slide'&&h.isTurn?'SWEEP!':h.modePhase==='results'?'END RESULTS':'MARBLE CURLING',
          (h.roundScore||0)+' points · '+(h.modeHint||h.turnLabel||''));
        if(h.vip)vip=[['lobby','End game & lobby']];
        break;
      case 'derby':
        setText('',h.modePhase==='betting'?'PLACE YOUR BET':h.modePhase==='racing'?'THEY ARE OFF!':h.modePhase==='results'?'HEAT RESULTS':'DERBY FINISHED',
          (h.gems||0)+' virtual gems · '+(h.modeHint||h.turnLabel||''));
        // Persistent header lobby button already exists: no duplicate host exit.
        break;
      case 'brawl':
        setText('', h.modePhase==='eliminated'?'OUT OF THE BOWL':h.modePhase==='finished'?'BRAWL COMPLETE':'BOWL BRAWL',
          (h.roundScore||0)+' points · '+(h.turnLabel||'Bowl Brawl'));
        if(h.vip)vip=[['lobby','End game & lobby']];
        break;
      case 'dropzone': {
        const dropping=h.modePhase==='aim'&&h.isTurn;
        const predicting=h.modePhase==='falling'&&h.isTurn;
        setText('', dropping?'LINE UP YOUR DROP':predicting?'PREDICT THE PRIZE':h.modePhase==='falling'?'MARBLE IN PLAY':'WATCH THE JACKPOT',
          (h.roundScore||0)+' points · '+(h.turnLabel||'Drop Zone'));
        // The top header already has the VIP's persistent Lobby button.
        break;
      }
      case 'race':
        if(h.vip)vip=[['lobby','Back to Lobby']];
        if (!h.inRace) { setText('', 'Watch the TV!', 'You join the next race'); break; }
        if (h.fin) setText(`${ORD(h.place)}`, 'Finished!', 'Watch the others come home');
        else if (h.off) setText(`${ORD(h.place)}<small>/${h.n}</small>`, 'Whoops!', 'Back on the track in a moment');
        else setText(`${ORD(h.place)}<small>/${h.n}</small>`, h.item ? ITEM_NAME[h.item] + ' ready' : '', h.item ? 'Tap the item button to use it' : '');
        break;
      case 'vote':
        setText('', h.picked >= 0 ? 'Track chosen!' : h.myVote >= 0 ? 'Vote in — change it any time' : 'Pick the next track', `Race ${h.cupRace + 1} of ${h.cupN}`);
        if (h.vip) vip = h.picked < 0 ? [['lobby','Back to Lobby'],['skip','Decide now']] : [['lobby','Back to Lobby']];
        break;
      case 'results':
        setText(h.lastPlace ? ORD(h.lastPlace) : '', h.lastPlace ? `+${h.pts} points` : 'Watch the TV!', `Cup: ${h.total} points · race ${h.cupRace} of ${h.cupN}`);
        if (h.vip) vip = h.cupDone ? [['lobby', 'Lobby'], ['next', 'Crown the champion', true]] : [['lobby', 'Lobby'], ['finale', 'End early'], ['next', 'Next race', true]];
        break;
      case 'finale':
        setText('🏆', h.award || 'Good Sport', `${h.total} points tonight`);
        if (h.vip) vip = [['lobby','Back to Lobby'],['newnight', h.partyPending ? 'Next party game' : 'New night', true]];
        break;
      default: setText('', 'Watch the TV!', '');
    }
    vipButtons(vip);
    renderModePanel(h);
    // Cheering works for finished/waiting Grand Prix racers as well.
    const cheer = $('#cheer');
    cheer.hidden = !(h.s === 'race' && (!h.inRace || h.fin));
    cheer.disabled = !h.cheerReady;
    // Phone layout adapter. New mode controls are activated only as their modes ship.
    const labels = {
      grandprix: ['TAP', 'boost · hold to grip'],
      dropzone: ['DROP', 'tap to release'],
      derby: ['CHEER!', 'back your marble, cheer once per heat'],
      brawl: ['RAM', 'hold to anchor'],
      curling: ['SWEEP', 'hold to brake'],
      golf: ['SHOOT!', 'aim and set power first']
    };
    const label = labels[h.mode] || labels.grandprix;
    $('#padText b').textContent = h.mode === 'grandprix' && h.s === 'race' && h.boost < 25 ? 'WAIT' : h.mode === 'grandprix' && h.s === 'race' && h.boost >= 100 ? 'SUPER!' : label[0];
    $('#padText span').textContent = h.mode === 'grandprix' && h.s === 'race' && h.boost < 25 ? 'meter is filling' : h.mode === 'grandprix' && h.s === 'race' && h.boost >= 100 ? 'full meter · tap now' : label[1];
  }

  function renderVotes(h) {
    const box = $('#votes');
    if (h.s !== 'vote' || !h.opts) { box.hidden = true; box.dataset.key = ''; return; }
    box.hidden = false;
    const key = h.opts.map(o => o.name).join() + '|' + h.myVote + '|' + h.picked;
    if (box.dataset.key === key) return;
    box.dataset.key = key; box.innerHTML = '';
    h.opts.forEach((o, i) => {
      const b = document.createElement('button');
      b.style.setProperty('--vc', `linear-gradient(135deg, ${o.c}, color-mix(in srgb, ${o.c} 45%, #14163A))`);
      b.innerHTML = `<span>${o.icon}</span>`; b.appendChild(document.createTextNode(o.name));
      b.setAttribute('aria-pressed', String(h.myVote === i));
      if (h.picked >= 0 && h.picked !== i) b.className = 'lost';
      b.onclick = () => { audio(); tone(900, 0.06, 'sine', 0.15); buzz(10); send({ t:'act', a:'vote', v:i }); };
      box.appendChild(b);
    });
  }
  /* ---------- pad input (Section 7.2) ---------- */
  const pad = $('#pad');
  let downId = null, downAt = 0, gripT = null;
  pad.addEventListener('pointerdown', e => {
    e.preventDefault(); audio();
    if (downId !== null) return;
    downId = e.pointerId; downAt = performance.now();
    try { pad.setPointerCapture(e.pointerId); } catch(x){}
    pad.classList.add('down');
    send({ t:'in', k:'p' });
    gripT = setTimeout(() => { pad.classList.add('grip'); tone(160, 0.25, 'sine', 0.08); }, 120);
  });
  function up(e) {
    if (downId === null || (e && e.pointerId !== downId)) return;
    downId = null; clearTimeout(gripT);
    pad.classList.remove('down', 'grip');
    send({ t:'in', k:'r' });
    const held = performance.now() - downAt;
    if (held <= 180) {
      const canBoost = !hud || hud.s !== 'race' || hud.boost >= 25;
      if (canBoost) {
        const sup = hud && hud.s === 'race' && hud.boost >= 100;
        tone(sup ? 420 : 320, sup ? 0.3 : 0.18, 'triangle', sup ? 0.22 : 0.16, sup ? 1500 : 980); buzz(sup ? 40 : 15);
        pad.classList.remove('burst'); void pad.offsetWidth; pad.classList.add('burst');
        $('#flash').classList.remove('on'); void $('#flash').offsetWidth; $('#flash').classList.add('on');
      } else { tone(110, 0.15, 'square', 0.08, 70); }
    }
  }
  pad.addEventListener('pointerup', up);
  pad.addEventListener('pointercancel', up);
  pad.addEventListener('lostpointercapture', up);
  pad.addEventListener('contextmenu', e => e.preventDefault());
  $('#item').addEventListener('pointerdown', e => {
    e.preventDefault(); audio();
    if (!hud || !hud.item) return;
    send({ t:'in', k:'i' }); tone(700, 0.3, 'sine', 0.14, 1500); buzz([10, 30, 10]);
  });
  $('#hcBtn').onclick = () => { document.body.classList.toggle('hc'); store.set('mr_hc', document.body.classList.contains('hc') ? '1' : '0'); };
  document.addEventListener('gesturestart', e => e.preventDefault());
})();
</script>
